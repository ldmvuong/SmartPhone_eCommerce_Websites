<!DOCTYPE html>
<!--[if IE 8 ]>
<html class="ie" xmlns="http://www.w3.org/1999/xhtml" xml:lang="en-US" lang="en-US"> <![endif]-->
<!--[if (gte IE 9)|!(IE)]><!-->
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="en-US" lang="en-US">
<!--<![endif]-->

<head>
    <!-- Basic Page Needs -->
    <meta charset="utf-8">
    <!--[if IE]>
    <meta http-equiv='X-UA-Compatible' content='IE=edge,chrome=1'><![endif]-->
    <title>Remos eCommerce Admin Dashboard HTML Template</title>

    <meta name="author" content="themesflat.com">

    <!-- Mobile Specific Metas -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">

    <!-- Theme Style -->
    <link rel="stylesheet" type="text/css" th:href="@{/admin/css/animate.min.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/admin/css/animation.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/admin/css/bootstrap.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/admin/css/bootstrap-select.min.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/admin/css/style.css}">

    <!-- Font -->
    <link rel="stylesheet" th:href="@{/admin/font/fonts.css}">

    <!-- Icon -->
    <link rel="stylesheet" th:href="@{/admin/icon/style.css}">

    <!-- Favicon and Touch Icons  -->
    <link rel="shortcut icon" th:href="@{/admin/images/favicon.png}">
    <link rel="apple-touch-icon-precomposed" th:href="@{/admin/images/favicon.png}">

</head>

<body class="body">

<!-- #wrapper -->
<div id="wrapper">
    <!-- #page -->
    <div id="page" class="">
        <!-- layout-wrap -->
        <div class="layout-wrap">
            <!-- preload -->
            <div id="preload" class="preload-container">
                <div class="preloading">
                    <span></span>
                </div>
            </div>
            <!-- /preload -->
            <!-- section-menu-left -->
            <div th:replace="admin/fragments/menu-left.html"></div>
            <!-- /section-menu-left -->
            <!-- section-content-right -->
            <div class="section-content-right">
                <!-- header-dashboard -->
                <div th:replace="admin/fragments/header.html"></div>
                <!-- /header-dashboard -->
                <!-- main-content -->
                <div class="main-content">
                    <!-- main-content-wrap -->
                    <div class="main-content-inner">
                        <!-- main-content-wrap -->
                        <div class="main-content-wrap">
                            <div class="flex items-center flex-wrap justify-between gap20 mb-27">
                                <h3>Add New User</h3>
                                <ul class="breadcrumbs flex items-center flex-wrap justify-start gap10">
                                    <li>
                                        <a href="index.html">
                                            <div class="text-tiny">Dashboard</div>
                                        </a>
                                    </li>
                                    <li>
                                        <i class="icon-chevron-right"></i>
                                    </li>
                                    <li>
                                        <a href="#">
                                            <div class="text-tiny">User</div>
                                        </a>
                                    </li>
                                    <li>
                                        <i class="icon-chevron-right"></i>
                                    </li>
                                    <li>
                                        <div class="text-tiny">Add New User</div>
                                    </li>
                                </ul>
                            </div>
                            <!-- add-new-user -->
                            <form class="form-add-new-user form-style-2">
                                <div class="wg-box">
                                    <div class="left">
                                        <h5 class="mb-4">Account</h5>
                                        <div class="body-text">Fill in the information below to add a new account</div>
                                    </div>
                                    <div class="right flex-grow">
                                        <fieldset class="name mb-24">
                                            <div class="body-title mb-10">Name</div>
                                            <input class="flex-grow" type="text" placeholder="Username" name="name"
                                                   tabindex="0" value="" aria-required="true" required="">
                                        </fieldset>
                                        <fieldset class="email mb-24">
                                            <div class="body-title mb-10">Email</div>
                                            <input class="flex-grow" type="email" placeholder="Email" name="email"
                                                   tabindex="0" value="" aria-required="true" required="">
                                        </fieldset>
                                        <fieldset class="password mb-24">
                                            <div class="body-title mb-10">Password</div>
                                            <input class="password-input" type="password" placeholder="Enter password"
                                                   name="password" tabindex="0" value="" aria-required="true"
                                                   required="">
                                            <span class="show-pass">
                                                    <i class="icon-eye view"></i>
                                                    <i class="icon-eye-off hide"></i>
                                                </span>
                                        </fieldset>
                                        <fieldset class="password">
                                            <div class="body-title mb-10">Confirm password</div>
                                            <input class="password-input" type="password" placeholder="Confirm password"
                                                   name="password" tabindex="0" value="" aria-required="true"
                                                   required="">
                                            <span class="show-pass">
                                                    <i class="icon-eye view"></i>
                                                    <i class="icon-eye-off hide"></i>
                                                </span>
                                        </fieldset>
                                    </div>
                                </div>
                                <div class="wg-box">
                                    <div class="left">
                                        <h5 class="mb-4">Pernission</h5>
                                        <div class="body-text">Items that the account is allowed to edit</div>
                                    </div>
                                    <div class="right flex-grow">
                                        <fieldset class="mb-24">
                                            <div class="body-title mb-10">Add product</div>
                                            <div class="radio-buttons">
                                                <div class="item">
                                                    <input class="" type="radio" name="add-product" id="add-product1"
                                                           checked>
                                                    <label class="" for="add-product1"><span
                                                            class="body-title-2">Allow</span></label>
                                                </div>
                                                <div class="item">
                                                    <input class="" type="radio" name="add-product" id="add-product2">
                                                    <label class="" for="add-product2"><span
                                                            class="body-title-2">Deny</span></label>
                                                </div>
                                            </div>
                                        </fieldset>
                                        <fieldset class="mb-24">
                                            <div class="body-title mb-10">Update product</div>
                                            <div class="radio-buttons">
                                                <div class="item">
                                                    <input class="" type="radio" name="update-product"
                                                           id="update-product1">
                                                    <label class="" for="update-product1"><span class="body-title-2">Allow</span></label>
                                                </div>
                                                <div class="item">
                                                    <input class="" type="radio" name="update-product"
                                                           id="update-product2" checked>
                                                    <label class="" for="update-product2"><span class="body-title-2">Deny</span></label>
                                                </div>
                                            </div>
                                        </fieldset>
                                        <fieldset class="mb-24">
                                            <div class="body-title mb-10">Delete product</div>
                                            <div class="radio-buttons">
                                                <div class="item">
                                                    <input class="" type="radio" name="delete-product"
                                                           id="delete-product1" checked>
                                                    <label class="" for="delete-product1"><span class="body-title-2">Allow</span></label>
                                                </div>
                                                <div class="item">
                                                    <input class="" type="radio" name="delete-product"
                                                           id="delete-product2">
                                                    <label class="" for="delete-product2"><span class="body-title-2">Deny</span></label>
                                                </div>
                                            </div>
                                        </fieldset>
                                        <fieldset class="mb-24">
                                            <div class="body-title mb-10">Apply discount</div>
                                            <div class="radio-buttons">
                                                <div class="item">
                                                    <input class="" type="radio" name="apply-product"
                                                           id="apply-product1">
                                                    <label class="" for="apply-product1"><span class="body-title-2">Allow</span></label>
                                                </div>
                                                <div class="item">
                                                    <input class="" type="radio" name="apply-product"
                                                           id="apply-product2" checked>
                                                    <label class="" for="apply-product2"><span
                                                            class="body-title-2">Deny</span></label>
                                                </div>
                                            </div>
                                        </fieldset>
                                        <fieldset class="">
                                            <div class="body-title mb-10">Create coupon</div>
                                            <div class="radio-buttons">
                                                <div class="item">
                                                    <input class="" type="radio" name="create-product"
                                                           id="create-product1">
                                                    <label class="" for="create-product1"><span class="body-title-2">Allow</span></label>
                                                </div>
                                                <div class="item">
                                                    <input class="" type="radio" name="create-product"
                                                           id="create-product2" checked>
                                                    <label class="" for="create-product2"><span class="body-title-2">Deny</span></label>
                                                </div>
                                            </div>
                                        </fieldset>
                                    </div>
                                </div>
                                <div class="bot">
                                    <button class="tf-button w180" type="submit">Save</button>
                                </div>

                            </form>
                            <!-- /add-new-user -->
                        </div>
                        <!-- /main-content-wrap -->
                    </div>
                    <!-- /main-content-wrap -->
                    <!-- bottom-page -->
                    <div th:replace="admin/fragments/bottom.html"></div>
                    <!-- /bottom-page -->
                </div>
                <!-- /main-content -->
            </div>
            <!-- /section-content-right -->
        </div>
        <!-- /layout-wrap -->
    </div>
    <!-- /#page -->
</div>
<!-- /#wrapper -->

<!-- Javascript -->
<script th:src="@{/admin/js/jquery.min.js}"></script>
<script th:src="@{/admin/js/bootstrap.min.js}"></script>
<script th:src="@{/admin/js/bootstrap-select.min.js}"></script>
<script th:src="@{/admin/js/zoom.js}"></script>
<script th:src="@{/admin/js/switcher.js}"></script>
<script th:src="@{/admin/js/theme-settings.js}"></script>
<script th:src="@{/admin/js/main.js}"></script>

</body>
</html>
