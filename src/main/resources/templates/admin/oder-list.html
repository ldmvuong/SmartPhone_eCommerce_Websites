<!DOCTYPE html>
<!--[if IE 8 ]><html class="ie" xmlns="http://www.w3.org/1999/xhtml" xml:lang="en-US" lang="en-US"> <![endif]-->
<!--[if (gte IE 9)|!(IE)]><!-->
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="en-US" lang="en-US" xmlns:th="http://www.thymeleaf.org">
<!--<![endif]-->

<head>
    <!-- Basic Page Needs -->
    <meta charset="utf-8">
    <!--[if IE]><meta http-equiv='X-UA-Compatible' content='IE=edge,chrome=1'><![endif]-->
    <title>Remos eCommerce Admin Dashboard HTML Template</title>

    <meta name="author" content="themesflat.com">

    <!-- Mobile Specific Metas -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">

    <!-- Theme Style -->
    <link rel="stylesheet" type="text/css" th:href="@{/admin/css/animate.min.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/admin/css/animation.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/admin/css/bootstrap.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/admin/css/bootstrap-select.min.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/admin/css/style.css}">

    <!-- Font -->
    <link rel="stylesheet" th:href="@{/admin/font/fonts.css}">

    <!-- Icon -->
    <link rel="stylesheet" th:href="@{/admin/icon/style.css}">

    <!-- Favicon and Touch Icons  -->
    <link rel="shortcut icon" th:href="@{/admin/images/favicon.png}">
    <link rel="apple-touch-icon-precomposed" th:href="@{/admin/images/favicon.png}">

</head>

<body class="body">

    <!-- #wrapper -->
    <div id="wrapper">
        <!-- #page -->
        <div id="page" class="">
            <!-- layout-wrap -->
           <div class="layout-wrap">
                <!-- preload -->
                <div id="preload" class="preload-container">
                    <div class="preloading">
                        <span></span>
                    </div>
                </div>
                <!-- /preload -->
                <!-- section-menu-left -->
               <div th:replace="~{admin/fragments/menu-left :: menu-left}"></div>
                <!-- /section-menu-left -->
                <!-- section-content-right -->
                <div class="section-content-right">
                    <!-- header-dashboard -->
                    <div th:replace="~{admin/fragments/header::header}"></div>
                    <!-- /header-dashboard -->
                    <!-- main-content -->
                    <div class="main-content">
                        <!-- main-content-wrap -->
                        <div class="main-content-inner">
                            <!-- main-content-wrap -->
                            <div class="main-content-wrap">
                                <div class="flex items-center flex-wrap justify-between gap20 mb-27">
                                    <h3>Order List</h3>
                                    <ul class="breadcrumbs flex items-center flex-wrap justify-start gap10">
                                        <li>
                                            <a href="index.html"><div class="text-tiny">Dashboard</div></a>
                                        </li>
                                        <li>
                                            <i class="icon-chevron-right"></i>
                                        </li>
                                        <li>
                                            <a href="#"><div class="text-tiny">Order</div></a>
                                        </li>
                                        <li>
                                            <i class="icon-chevron-right"></i>
                                        </li>
                                        <li>
                                            <div class="text-tiny">Order List</div>
                                        </li>
                                    </ul>
                                </div>
                                <!-- order-list -->
                                <div class="wg-box">
                                    <div class="flex items-center justify-between gap10 flex-wrap">
                                        <div class="wg-filter flex-grow">
                                            <div class="select">
                                                <form action="#" method="get">
                                                    <select name="status" onchange="this.form.submit()">
                                                        <option value="">All</option>
                                                        <option value="PENDING" th:selected="${status == 'PENDING'}">PENDING</option>
                                                        <option value="SHIPPING" th:selected="${status == 'SHIPPING'}">SHIPPING</option>
                                                        <option value="DELIVERED" th:selected="${status == 'DELIVERED'}">DELIVERED</option>
                                                        <option value="CANCELLED" th:selected="${status == 'CANCELLED'}">CANCELLED</option>
                                                    </select>
                                                </form>
                                            </div>
                                        </div>
                                    </div>

                                    <div class="wg-table table-all-category">
                                        <ul class="table-title flex gap20 mb-14">
                                            <li><div class="body-title">Product</div></li>
                                            <li><div class="body-title">Customer</div></li>
                                            <li><div class="body-title">Price</div></li>
                                            <li><div class="body-title">Quantity</div></li>
                                            <li><div class="body-title">Payment</div></li>
                                            <li><div class="body-title">Order time</div></li>
                                            <li><div class="body-title">Status</div></li>
                                            <li><div class="body-title">Action</div></li>
                                        </ul>

                                        <ul class="flex flex-column">
                                            <th:block th:each="order : ${orders}">
                                                <li class="product-item gap14">
                                                    <div class="image no-bg">
                                                        <img th:src="@{|/${order.productImage}}" alt="Product Image">
                                                    </div>
                                                    <div class="flex items-center justify-between gap20 flex-grow">
                                                        <div class="name">
                                                            <a class="body-title-2" th:text="${order.productName}"></a>
                                                        </div>
                                                        <div class="body-text" th:text="${order.customerName}"></div>
                                                        <div class="body-text" th:text="${order.totalPrice}"></div>
                                                        <div class="body-text" th:text="${order.totalQuantity}"></div>
                                                        <div class="body-text" th:text="${order.paymentMethod}"></div>
                                                        <div class="body-text" th:text="${order.orderDate}"></div>

                                                        <div>
                                                            <div th:class="${order.orderStatus == 'Success' ? 'block-available' : 'block-pending'}" th:text="${order.orderStatus}"></div>
                                                        </div>

                                                        <div class="list-icon-function">
                                                            <div class="item eye">
                                                                <a th:href="@{/admin/orders/order-detail/{orderId}(orderId=${order.orderId})}" title="Xem chi tiết đơn hàng">
                                                                    <i class="icon-eye"></i>
                                                                </a>
                                                            </div>
                                                        </div>
                                                    </div>
                                                </li>
                                            </th:block>
                                        </ul>
                                    </div>

                                    <div class="divider"></div>
                                    <div class="flex items-center justify-between flex-wrap gap10">
                                        <div class="text-tiny" th:text="'Showing ' + ${orders.size()} + ' entries'"></div>
                                        <ul class="wg-pagination">
                                            <li th:if="${currentPage > 1}">
                                                <a th:href="@{${'order-list'}(page=${currentPage - 1}, status=${status})}">
                                                    <i class="icon-chevron-left"></i>
                                                </a>
                                            </li>
                                            <li th:each="pageNum : ${#numbers.sequence(1, totalPages)}">
                                                <a th:href="@{${'order-list'}(page=${pageNum}, status=${status})}" th:text="${pageNum}" th:classappend="${pageNum == currentPage} ? 'active' : ''"></a>
                                            </li>
                                            <li th:if="${currentPage < totalPages}">
                                                <a th:href="@{${'order-list'}(page=${currentPage + 1}, status=${status})}">
                                                    <i class="icon-chevron-right"></i>
                                                </a>
                                            </li>
                                        </ul>
                                    </div>
                                </div>
                                <!-- /order-list -->
                            </div>
                            <!-- /main-content-wrap -->
                        </div>
                        <!-- /main-content-wrap -->
                        <!-- bottom-page -->
                        <div th:replace="~{admin/fragments/bottom::bottom-page}"></div>
                        <!-- /bottom-page -->
                    </div>
                    <!-- /main-content -->
                </div>
                <!-- /section-content-right -->
            </div>
            <!-- /layout-wrap -->
        </div>
        <!-- /#page -->
    </div>
    <!-- /#wrapper -->

    <!-- Javascript -->
    <script th:src="@{/admin/js/jquery.min.js}"></script>
    <script th:src="@{/admin/js/bootstrap.min.js}"></script>
    <script th:src="@{/admin/js/bootstrap-select.min.js}"></script>
    <script th:src="@{/admin/js/zoom.js}"></script>
    <script th:src="@{/admin/js/switcher.js}"></script>
    <script th:src="@{/admin/js/theme-settings.js}"></script>
    <script th:src="@{/admin/js/main.js}"></script>

</body>
</html>
