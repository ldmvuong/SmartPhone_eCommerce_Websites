<!DOCTYPE html>
<!--[if IE 8 ]>
<html class="ie" xmlns="http://www.w3.org/1999/xhtml" xml:lang="en-US" lang="en-US"> <![endif]-->
<!--[if (gte IE 9)|!(IE)]><!-->
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="en-US" lang="en-US" xmlns:th="http://www.thymeleaf.org">
<!--<![endif]-->

<head>
    <!-- Basic Page Needs -->
    <meta charset="utf-8">
    <!--[if IE]>
    <meta http-equiv='X-UA-Compatible' content='IE=edge,chrome=1'><![endif]-->
    <title>Remos eCommerce Admin Dashboard HTML Template</title>

    <meta name="author" content="themesflat.com">

    <!-- Mobile Specific Metas -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">

    <!-- Theme Style -->
    <link rel="stylesheet" type="text/css" th:href="@{/admin/css/animate.min.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/admin/css/animation.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/admin/css/bootstrap.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/admin/css/bootstrap-select.min.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/admin/css/style.css}">


    <!-- Font -->
    <link rel="stylesheet" th:href="@{/admin/font/fonts.css}">

    <!-- Icon -->
    <link rel="stylesheet" th:href="@{/admin/icon/style.css}">

    <!-- Favicon and Touch Icons  -->
    <link rel="shortcut icon" th:href="@{/admin/images/favicon.png}">
    <link rel="apple-touch-icon-precomposed" th:href="@{/admin/images/favicon.png}">

</head>

<body class="body">

<!-- #wrapper -->
<div id="wrapper">
    <!-- #page -->
    <div id="page" class="">
        <!-- layout-wrap -->
        <div class="layout-wrap">
            <!-- preload -->
            <div id="preload" class="preload-container">
                <div class="preloading">
                    <span></span>
                </div>
            </div>
            <!-- /preload -->
            <!-- section-menu-left -->
            <div th:replace="admin/fragments/menu-left.html"></div>
            <!-- /section-menu-left -->
            <!-- section-content-right -->
            <div class="section-content-right">
                <!-- header-dashboard -->
                <div th:replace="admin/fragments/header.html"></div>
                <!-- /header-dashboard -->
                <!-- main-content -->
                <div class="main-content">
                    <!-- main-content-wrap -->
                    <div class="main-content-inner">
                        <!-- main-content-wrap -->
                        <div class="main-content-wrap">
                            <div class="flex items-center flex-wrap justify-between gap20 mb-27">
                                <h3 th:if="${product.productId} != null">Edit Product</h3>
                                <h3 th:unless="${product.productId} != null">Add Product</h3>
                                <ul class="breadcrumbs flex items-center flex-wrap justify-start gap10">
                                    <li>
                                        <a href="index.html">
                                            <div class="text-tiny">Dashboard</div>
                                        </a>
                                    </li>
                                    <li>
                                        <i class="icon-chevron-right"></i>
                                    </li>
                                    <li>
                                        <a href="#">
                                            <div class="text-tiny">Ecommerce</div>
                                        </a>
                                    </li>
                                    <li>
                                        <i class="icon-chevron-right"></i>
                                    </li>
                                    <li>
                                        <div class="text-tiny" th:text="${product.productId} != null ? 'Edit Product' : 'Add Product'"></div>
                                    </li>
                                </ul>
                            </div>
                            <!-- form-add-product -->
                            <form class="tf-section-2 form-add-product" action="/admin/products/save" method="post"
                                  th:object="${product}" enctype="multipart/form-data">
                                <input type="hidden" th:field="*{productId}">

                                <div class="wg-box">
                                    <!-- Product Name -->
                                    <fieldset class="name">
                                        <div class="body-title mb-10">Product Name <span class="tf-color-1">*</span></div>
                                        <input class="mb-10" type="text" th:field="*{name}" placeholder="Enter product name" autocomplete="off">
                                        <div th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="error-message"></div>
                                    </fieldset>

                                    <!-- Category and Brand -->
                                    <div class="gap22 cols">
                                        <fieldset class="operatingSystem">
                                            <div class="body-title mb-10">Operating System <span class="tf-color-1">*</span></div>
                                                <input type="text" id="cbbOperatingSystem" list="osOptions" placeholder="Choose operating system" th:field="*{operatingSystem}">
                                                <datalist id="osOptions">
                                                    <option value="Android">
                                                    <option value="iPhone">
                                                </datalist>
                                            <div th:if="${#fields.hasErrors('operatingSystem')}" th:errors="*{operatingSystem}" class="error-message"></div>
                                        </fieldset>

                                        <fieldset class="brand">
                                            <div class="body-title mb-10">Brand <span class="tf-color-1">*</span></div>
                                            <select th:field="*{brandId}">
                                                <option value="0">Choose brand</option> <!-- Option mặc định không cần bao quanh -->
                                                <option th:each="brand : ${brands}"
                                                        th:value="${brand.id}"
                                                        th:text="${brand.name}"
                                                        th:selected="${brand.id == product.brandId}">
                                                </option>
                                            </select>
                                            <div th:if="${#fields.hasErrors('brandId')}" th:errors="*{brandId}" class="error-message"></div>
                                        </fieldset>
                                    </div>

                                    <!-- Processor and Battery -->
                                    <div class="gap22 cols">
                                        <fieldset class="processor">
                                            <div class="body-title mb-10">Processor <span class="tf-color-1">*</span></div>
                                                <input type="text" th:field="*{processor}" list="processorOptions" placeholder="Enter or select processor details">
                                                <datalist id="processorOptions">
                                                    <option value="Snapdragon 888">
                                                    <option value="Snapdragon 870">
                                                    <option value="Apple A15 Bionic">
                                                    <option value="Exynos 2100">
                                                    <option value="MediaTek Dimensity 1200">
                                                </datalist>
                                            <div th:if="${#fields.hasErrors('processor')}" th:errors="*{processor}" class="error-message"></div>
                                        </fieldset>


                                        <fieldset class="battery">
                                            <div class="body-title mb-10">Battery Capacity <span class="tf-color-1">*</span></div>
                                                <input type="text" th:field="*{batteryCapacity}" list="batteryOptions" placeholder="Enter or select battery capacity (e.g., 5000mAh)">
                                                <datalist id="batteryOptions">
                                                    <option value="3000mAh">
                                                    <option value="4000mAh">
                                                    <option value="4500mAh">
                                                    <option value="5000mAh">
                                                    <option value="6000mAh">
                                                </datalist>
                                            <div th:if="${#fields.hasErrors('batteryCapacity')}" th:errors="*{batteryCapacity}" class="error-message"></div>
                                        </fieldset>

                                    </div>

                                    <!-- Camera and Warranty Period -->
                                    <div class="gap22 cols">
                                        <fieldset class="camera">
                                            <div class="body-title mb-10">Camera <span class="tf-color-1">*</span></div>
                                                <input type="text" th:field="*{camera}" list="cameraOptions" placeholder="Enter or select camera specifications">
                                                <datalist id="cameraOptions">
                                                    <option value="12 MP - Single">
                                                    <option value="12 MP + 12 MP - Dual">
                                                    <option value="48 MP - Triple">
                                                    <option value="108 MP - Quad">
                                                    <option value="Selfie Camera 32 MP">
                                                </datalist>
                                            <div th:if="${#fields.hasErrors('camera')}" th:errors="*{camera}" class="error-message"></div>
                                        </fieldset>


                                        <fieldset class="warranty">
                                            <div class="body-title mb-10">Warranty Period <span class="tf-color-1">*</span></div>
                                                <input type="text" th:field="*{warrantyPeriod}" list="warrantyOptions" placeholder="Enter or select warranty period (e.g., 2 years)">
                                                <datalist id="warrantyOptions">
                                                    <option value="1 year">
                                                    <option value="2 years">
                                                    <option value="3 years">
                                                    <option value="6 months">
                                                    <option value="No warranty">
                                                </datalist>
                                            <div th:if="${#fields.hasErrors('warrantyPeriod')}" th:errors="*{warrantyPeriod}" class="error-message"></div>
                                        </fieldset>

                                    </div>

                                    <!-- Quantity and Price -->
                                    <div class="gap22 cols">
                                        <fieldset class="quantity">
                                            <div class="body-title mb-10">Quantity <span class="tf-color-1">*</span></div>
                                            <input type="number" th:field="*{stockQuantity}" placeholder="Enter quantity" >
                                            <div th:if="${#fields.hasErrors('stockQuantity')}" th:errors="*{stockQuantity}" class="error-message"></div>
                                        </fieldset>

                                        <fieldset class="price">
                                            <div class="body-title mb-10">Price <span class="tf-color-1">*</span></div>
                                            <input type="number" th:field="*{price}" placeholder="Enter price" >
                                            <div th:if="${#fields.hasErrors('price')}" th:errors="*{price}" class="error-message"></div>
                                        </fieldset>
                                    </div>

                                    <!-- SIM and Connectivity -->
                                    <div class="gap22 cols">
                                        <fieldset class="sim">
                                            <div class="body-title mb-10">SIM <span class="tf-color-1">*</span></div>
                                                <input type="text" th:field="*{sim}" list="simOptions" placeholder="Enter or select SIM type">
                                                <datalist id="simOptions">
                                                    <option value="Nano SIM">
                                                    <option value="Micro SIM">
                                                    <option value="eSIM">
                                                    <option value="Dual SIM">
                                                </datalist>
                                            <div th:if="${#fields.hasErrors('sim')}" th:errors="*{sim}" class="error-message"></div>
                                        </fieldset>


                                        <fieldset class="connectivity">
                                            <div class="body-title mb-10">Connectivity <span class="tf-color-1">*</span></div>
                                                <input type="text" th:field="*{connectivity}" list="connectivityOptions" placeholder="Enter or select connectivity type">
                                                <datalist id="connectivityOptions">
                                                    <option value="WiFi">
                                                    <option value="Bluetooth">
                                                    <option value="5G">
                                                    <option value="4G LTE">
                                                    <option value="NFC">
                                                </datalist>
                                            <div th:if="${#fields.hasErrors('connectivity')}" th:errors="*{connectivity}" class="error-message"></div>
                                        </fieldset>

                                    </div>

                                    <!-- Description -->
                                    <fieldset class="description">
                                        <div class="body-title mb-10">Description <span class="tf-color-1">*</span></div>
                                        <textarea th:field="*{description}" placeholder="Enter product description" ></textarea>
                                        <div th:if="${#fields.hasErrors('description')}" th:errors="*{description}" class="error-message"></div>
                                    </fieldset>
                                </div>

                                <!-- Upload Image -->
                                <div class="wg-box">
                                    <fieldset>
                                        <div class="body-title mb-10">Upload Image</div>

                                        <!-- Khu vực hiển thị ảnh preview -->
                                        <div class="preview-container mb-10">
                                            <!-- Hiển thị ảnh cũ khi form tải -->
                                            <img id="imagePreview"
                                                 th:src="@{|/${product.imagePath}|}" alt="" width="200px">

                                        </div>

                                        <!-- Khung upload ảnh luôn hiển thị -->
                                        <div class="upload-image">
                                            <div class="item up-load">
                                                <label class="uploadfile" for="file">
                                                    <span class="icon"><i class="icon-upload-cloud"></i></span>
                                                    <span class="text-tiny">Drop your image here or select <span class="tf-color">click to browse</span></span>
                                                    <input type="file" id="file" name="file" accept="image/*" onchange="previewImage(event)">
                                                </label>
                                            </div>
                                        </div>
                                        <input type="hidden" id="existingImagePath" name="existingImagePath" th:value="${product.imagePath}" />
                                        <!-- Hiển thị thông báo lỗi nếu có -->
                                        <div th:if="${fileError}" class="error-message" th:text="${fileError}"></div>

                                    </fieldset>

                                    <!-- Submit Button -->
                                    <div class="cols gap10">
                                        <button class="tf-button w-full" type="submit" th:if="${product.productId != null}" th:text="'Update Product'"></button>
                                        <button class="tf-button w-full" type="submit" th:unless="${product.productId != null}" th:text="'Add Product'"></button>
                                    </div>
                                </div>

                            </form>
                            <!-- /form-add-product -->
                        </div>
                        <!-- /main-content-wrap -->
                    </div>
                    <!-- /main-content-wrap -->
                    <!-- bottom-page -->
                    <div th:replace="admin/fragments/bottom.html"></div>
                    <!-- /bottom-page -->
                </div>
                <!-- /main-content -->
            </div>
            <!-- /section-content-right -->
        </div>
        <!-- /layout-wrap -->
    </div>
    <!-- /#page -->
</div>
<!-- /#wrapper -->

<!-- Javascript -->
<script>
    function previewImage(event) {
        const file = event.target.files[0];
        const preview = document.getElementById('imagePreview');

        if (file) {
            // Nếu có ảnh mới được chọn, hiển thị ảnh mới
            const reader = new FileReader();
            reader.onload = function(e) {
                preview.src = e.target.result; // Hiển thị ảnh mới
                preview.style.display = 'block';
            };
            reader.readAsDataURL(file);
        }
    }
</script>
<script th:src="@{/admin/js/jquery.min.js}"></script>
<script th:src="@{/admin/js/bootstrap.min.js}"></script>
<script th:src="@{/admin/js/bootstrap-select.min.js}"></script>
<script th:src="@{/admin/js/zoom.js}"></script>
<script th:src="@{/admin/js/switcher.js}"></script>
<script th:src="@{/admin/js/theme-settings.js}"></script>
<script th:src="@{/admin/js/main.js}"></script>

</body>
</html>
