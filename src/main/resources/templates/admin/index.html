<!DOCTYPE html>
<!--[if IE 8 ]><html class="ie" xmlns="http://www.w3.org/1999/xhtml" xml:lang="en-US" lang="en-US" > <![endif]-->
<!--[if (gte IE 9)|!(IE)]><!-->
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="en-US" lang="en-US" xmlns:th="http://www.thymeleaf.org">

<!--<![endif]-->
<head th:replace="~{admin/fragments/head::head}"></head>

<body class="body">

    <!-- #wrapper -->
    <div id="wrapper">
        <!-- #page -->
        <div id="page" class="">
            <!-- layout-wrap -->
           <div class="layout-wrap">
                <!-- preload -->
                <div id="preload" class="preload-container">
                    <div class="preloading">
                        <span></span>
                    </div>
                </div>
                <!-- /preload -->
                <!-- section-menu-left -->
                <div th:replace="~{admin/fragments/menu-left.html}"></div>
                <!-- /section-menu-left -->
                <!-- section-content-right -->
                <div class="section-content-right">
                    <!-- header-dashboard -->
                    <div th:replace="~{admin/fragments/header.html}"></div>
                    <!-- /header-dashboard -->
                    <!-- main-content -->
                    <div class="main-content">
                        <!-- main-content-wrap -->
                        <div class="main-content-inner">
                            <!-- main-content-wrap -->
                            <div class="main-content-wrap">
                                <div class="tf-section-4 mb-30">
                                    <!-- chart-default -->
                                    <div class="wg-chart-default">
                                        <div class="flex items-center justify-between">
                                            <div class="flex items-center gap14">
                                                <div class="image type-white">
                                                    <svg xmlns="http://www.w3.org/2000/svg" width="48" height="52" viewBox="0 0 48 52" fill="none">
                                                        <path d="M19.1094 2.12943C22.2034 0.343099 26.0154 0.343099 29.1094 2.12943L42.4921 9.85592C45.5861 11.6423 47.4921 14.9435 47.4921 18.5162V33.9692C47.4921 37.5418 45.5861 40.8431 42.4921 42.6294L29.1094 50.3559C26.0154 52.1423 22.2034 52.1423 19.1094 50.3559L5.72669 42.6294C2.63268 40.8431 0.726688 37.5418 0.726688 33.9692V18.5162C0.726688 14.9435 2.63268 11.6423 5.72669 9.85592L19.1094 2.12943Z" fill="#22C55E"/>
                                                    </svg>
                                                    <i class="icon-shopping-bag"></i>
                                                </div>
                                                <div>
                                                    <div class="body-text mb-2">Total Orders</div>
                                                    <h4 th:text="${orderCount}"></h4>
                                                </div>
                                            </div>
                                            <div class="box-icon-trending up">
                                                <i class="icon-trending-up"></i>
                                                <div class="body-title number">1.56%</div>
                                            </div>
                                        </div>
                                        <div class="wrap-chart">
                                            <div id="line-chart-1"></div>
                                        </div>
                                    </div>
                                    <!-- /chart-default -->
                                    <!-- chart-default -->
                                    <div class="wg-chart-default">
                                        <div class="flex items-center justify-between">
                                            <div class="flex items-center gap14">
                                                <div class="image type-white">
                                                    <svg xmlns="http://www.w3.org/2000/svg" width="48" height="52" viewBox="0 0 48 52" fill="none">
                                                        <path d="M19.1094 2.12943C22.2034 0.343099 26.0154 0.343099 29.1094 2.12943L42.4921 9.85592C45.5861 11.6423 47.4921 14.9435 47.4921 18.5162V33.9692C47.4921 37.5418 45.5861 40.8431 42.4921 42.6294L29.1094 50.3559C26.0154 52.1423 22.2034 52.1423 19.1094 50.3559L5.72669 42.6294C2.63268 40.8431 0.726688 37.5418 0.726688 33.9692V18.5162C0.726688 14.9435 2.63268 11.6423 5.72669 9.85592L19.1094 2.12943Z" fill="#FF5200"/>
                                                    </svg>
                                                    <i class="icon-dollar-sign"></i>
                                                </div>
                                                <div>
                                                    <div class="body-text mb-2">Total Income
                                                        <span>
                                                            <div class="box-icon-trending down">
                                                                <i class="icon-trending-down"></i>
                                                                <div class="body-title number">1.32%</div>
                                                            </div>
                                                        </span>
                                                    </div>
                                                    <h4><span th:text="${totalPrice}"></span></h4>
                                                </div>
                                            </div>

                                        </div>
                                        <div class="wrap-chart">
                                            <div id="line-chart-2"></div>
                                        </div>
                                    </div>
                                    <!-- /chart-default -->
                                    <!-- chart-default -->
                                    <div class="wg-chart-default">
                                        <div class="flex items-center justify-between">
                                            <div class="flex items-center gap14">
                                                <div class="image type-white">
                                                    <svg xmlns="http://www.w3.org/2000/svg" width="48" height="52" viewBox="0 0 48 52" fill="none">
                                                        <path d="M19.1094 2.12943C22.2034 0.343099 26.0154 0.343099 29.1094 2.12943L42.4921 9.85592C45.5861 11.6423 47.4921 14.9435 47.4921 18.5162V33.9692C47.4921 37.5418 45.5861 40.8431 42.4921 42.6294L29.1094 50.3559C26.0154 52.1423 22.2034 52.1423 19.1094 50.3559L5.72669 42.6294C2.63268 40.8431 0.726688 37.5418 0.726688 33.9692V18.5162C0.726688 14.9435 2.63268 11.6423 5.72669 9.85592L19.1094 2.12943Z" fill="#CBD5E1"/>
                                                    </svg>
                                                    <i class="icon-file"></i>
                                                </div>
                                                <div>
                                                    <div class="body-text mb-2">Total Products</div>
                                                    <h4 th:text="${productCount}"></h4>
                                                </div>
                                            </div>
                                            <div class="box-icon-trending">
                                                <i class="icon-trending-up"></i>
                                                <div class="body-title number">1.06%</div>
                                            </div>
                                        </div>
                                        <div class="wrap-chart">
                                            <div id="line-chart-3"></div>
                                        </div>
                                    </div>
                                    <!-- /chart-default -->
                                    <!-- chart-default -->
                                    <div class="wg-chart-default">
                                        <div class="flex items-center justify-between">
                                            <div class="flex items-center gap14">
                                                <div class="image type-white">
                                                    <svg xmlns="http://www.w3.org/2000/svg" width="48" height="52" viewBox="0 0 48 52" fill="none">
                                                        <path d="M19.1094 2.12943C22.2034 0.343099 26.0154 0.343099 29.1094 2.12943L42.4921 9.85592C45.5861 11.6423 47.4921 14.9435 47.4921 18.5162V33.9692C47.4921 37.5418 45.5861 40.8431 42.4921 42.6294L29.1094 50.3559C26.0154 52.1423 22.2034 52.1423 19.1094 50.3559L5.72669 42.6294C2.63268 40.8431 0.726688 37.5418 0.726688 33.9692V18.5162C0.726688 14.9435 2.63268 11.6423 5.72669 9.85592L19.1094 2.12943Z" fill="#2377FC"/>
                                                    </svg>
                                                    <i class="icon-users"></i>
                                                </div>
                                                <div>
                                                    <div class="body-text mb-2">Total Users</div>
                                                    <h4 th:text="${userCount}"></h4>
                                                </div>
                                            </div>
                                            <div class="box-icon-trending up">
                                                <i class="icon-trending-up"></i>
                                                <div class="body-title number">1.56%</div>
                                            </div>
                                        </div>
                                        <div class="wrap-chart">
                                            <div id="line-chart-4"></div>
                                        </div>
                                    </div>
                                    <!-- /chart-default -->
                                </div>
                                <div class="tf-section-3">
                                    <!-- orders -->
                                    <div class="wg-box">
                                        <div class="flex items-center justify-between">
                                            <h5>Top 5 Best Seller</h5>
                                        </div>
                                        <div class="wg-table">
                                            <ul class="table-title flex justify-between gap20 mb-14">
                                                <li>
                                                    <div class="body-title">Product Name</div>
                                                </li>
                                                <li>
                                                    <div class="body-title">Total Purchases</div>
                                                </li>
                                            </ul>
                                            <ul class="flex flex-column gap18">
                                                <!-- Lặp qua danh sách top sản phẩm bán chạy -->
                                                <th:block th:each="productSales : ${productSalesDTOS}">
                                                    <li class="shop-item">
                                                        <div class="image">
                                                            <img th:src="@{|/${productSales.imagePath}|}" alt="Product Image"/>
                                                        </div>
                                                        <div class="flex-grow flex items-center justify-between gap20">
                                                            <div>
                                                                <a href="#" class="tf-color-3 body-text name" th:text="${productSales.productName}"></a>
                                                            </div>
                                                            <div class="body-text tf-color-3" th:text="${productSales.totalQuantitySold}"></div>
                                                        </div>
                                                    </li>
                                                </th:block>
                                            </ul>
                                        </div>
                                    </div>
                                    <!-- /orders -->
                                    <div class="wg-box">
                                        <div class="flex items-center justify-between">
                                            <h5>Top 5 Customers</h5>
                                        </div>
                                        <div class="wg-table">
                                            <ul class="table-title flex justify-between gap20 mb-14">
                                                <li>
                                                    <div class="body-title">Name</div>
                                                </li>
                                                <li>
                                                    <div class="body-title">Total Money</div>
                                                </li>
                                            </ul>
                                            <ul class="flex flex-column gap18">
                                                <!-- Lặp qua danh sách khách hàng từ model -->
                                                <th:block th:each="customer : ${customerSalesDTOS}">
                                                    <li class="shop-item">
                                                        <div class="image">
                                                            <img th:src="@{/admin/images/avatar/user-2.png}" alt="User Avatar">
                                                        </div>
                                                        <div class="flex-grow flex items-center justify-between gap20">
                                                            <div>
                                                                <!-- Hiển thị tên khách hàng -->
                                                                <a href="#" class="tf-color-3 body-text name" th:text="${customer.lastName} + ' ' + ${customer.firstName}"></a>
                                                                <!-- Hiển thị số lượng đơn hàng -->
                                                                <div class="text-tiny mt-4" th:text="${customer.totalOrders} + ' Purchases'"></div>
                                                            </div>
                                                            <!-- Hiển thị tổng số tiền khách hàng đã chi tiêu -->
                                                            <div class="body-text tf-color-3" th:text="${customer.priceFormat}"></div>
                                                        </div>
                                                    </li>
                                                </th:block>
                                            </ul>
                                        </div>
                                    </div>
                                    <!-- new-comment -->
                                    <div class="wg-box">
                                        <div class="flex items-center justify-between">
                                            <h5>New Comments</h5>
                                        </div>
                                        <ul class="flex flex-column gap20 overflow-h">
                                            <!-- Lặp qua danh sách ratingRespones -->
                                            <th:block th:each="rating : ${ratingRespones}">
                                                <li class="comment-item">
                                                    <div class="image">
                                                        <!-- Đặt ảnh đại diện người dùng -->
                                                        <img th:src="@{/admin/images/avatar/user-2.png}" alt="">
                                                    </div>
                                                    <div class="">
                                                        <!-- Hiển thị tên người bình luận -->
                                                        <div class="mb-4 name">
                                                            <a href="#" class="body-title-2" th:text="${rating.userName}"></a>
                                                        </div>

                                                        <!-- Hiển thị các sao đánh giá -->
                                                        <div class="ratings mb-10">
                                                            <i class="icon-star1" th:classappend="${rating.star >= 1 ? ' active' : ''}"></i>
                                                            <i class="icon-star1" th:classappend="${rating.star >= 2 ? ' active' : ''}"></i>
                                                            <i class="icon-star1" th:classappend="${rating.star >= 3 ? ' active' : ''}"></i>
                                                            <i class="icon-star1" th:classappend="${rating.star >= 4 ? ' active' : ''}"></i>
                                                            <i class="icon-star1" th:classappend="${rating.star >= 5 ? ' active' : ''}"></i>
                                                        </div>

                                                        <!-- Hiển thị tên sản phẩm -->
                                                        <div class="text-tiny" th:text="${rating.productName}"></div>

                                                        <!-- Hiển thị nội dung bình luận -->
                                                        <div class="text-tiny" th:text="${rating.content}"></div>
                                                    </div>
                                                </li>
                                            </th:block>
                                        </ul>
                                    </div>
                                    <!-- /new-comment -->
                                </div>
                            </div>
                            <!-- /main-content-wrap -->
                        </div>
                        <!-- /main-content-wrap -->
                        <!-- bottom-page -->
                        <div th:replace="~{admin/fragments/bottom.html}"></div>
                        <!-- /bottom-page -->
                    </div>
                    <!-- /main-content -->
                </div>
                <!-- /section-content-right -->
            </div>
            <!-- /layout-wrap -->
        </div>
        <!-- /#page -->
    </div>
    <!-- /#wrapper -->

    <!-- Javascript -->
    <script th:src="@{/admin/js/jquery.min.js}"></script>
    <script th:src="@{/admin/js/bootstrap.min.js}"></script>
    <script th:src="@{/admin/js/bootstrap-select.min.js}"></script>
    <script th:src="@{/admin/js/zoom.js}"></script>
    <script th:src="@{/admin/js/apexcharts/apexcharts.js}"></script>
    <script th:src="@{/admin/js/apexcharts/line-chart-1.js}"></script>
    <script th:src="@{/admin/js/apexcharts/line-chart-2.js}"></script>
    <script th:src="@{/admin/js/apexcharts/line-chart-3.js}"></script>
    <script th:src="@{/admin/js/apexcharts/line-chart-4.js}"></script>
    <script th:src="@{/admin/js/apexcharts/line-chart-5.js}"></script>
    <script th:src="@{/admin/js/apexcharts/line-chart-6.js}"></script>
    <script th:src="@{/admin/js/switcher.js}"></script>
    <script th:src="@{/admin/js/theme-settings.js}"></script>
    <script th:src="@{/admin/js/main.js}"></script>

</body>

</html>
