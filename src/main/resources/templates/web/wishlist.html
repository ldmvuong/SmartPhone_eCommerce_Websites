<!doctype html>
<html xmlns:th="https://www.thymeleaf.org">

<!-- Mirrored from htmldemo.net/subas/subas/wishlist.html by HTTrack Website Copier/3.x [XR&CO'2014], Tue, 15 Oct 2024 02:16:27 GMT -->
<head th:replace="~{web/fragments/head::head}"></head>

<body>
    <!--[if lt IE 8]>
        <p class="browserupgrade">You are using an <strong>outdated</strong> browser. Please <a href="http://browsehappy.com/">upgrade your browser</a> to improve your experience.</p>
    <![endif]-->  

    <!-- Body main wrapper start -->
    <div class="wrapper">

        <!-- START HEADER AREA -->
        <header th:insert="~{web/fragments/header::header}"></header>
        <!-- END HEADER AREA -->

        <!-- Start page content -->
        <section id="page-content" class="page-wrapper section">

            <!-- SHOP SECTION START -->
            <div class="shop-section mb-80">
                <div class="container">
                    <div class="row">
                        <div class="col-lg-12">
                            <!-- Tab panes -->
                            <div class="tab-content">
                                <!-- wishlist start -->
                                <div class="tab-pane active" id="wishlist">
                                    <div class="wishlist-content">
                                        <div class="table-content table-responsive mb-50">
                                            <table class="text-center">
                                                <thead>
                                                <tr>
                                                    <th class="product-thumbnail">product</th>
                                                    <th class="product-price">price</th>
                                                    <th class="product-stock">Stock status</th>
                                                    <th class="product-add-cart">add to cart</th>
                                                    <th class="product-remove">remove</th>
                                                </tr>
                                                </thead>
                                                <tbody>
                                                <!-- tr -->
                                                <tr th:each="wishlist : ${wishlistDTOList}">
                                                    <td class="product-thumbnail">
                                                        <div class="pro-thumbnail-img">
                                                            <img th:src="@{|/${wishlist.productId.imagePath}|}" alt="">
                                                        </div>
                                                        <div class="pro-thumbnail-info text-start">
                                                            <h6 class="product-title-2">
                                                                <a th:href="@{/products/{id}(id=${wishlist.productId.productId})}" th:text="${wishlist.productId.name}"></a>
                                                            </h6>
                                                            <p>Brand: <span th:text="${wishlist.productId.brandName}"></span></p>
                                                            <p>Operating system: <span th:text="${wishlist.productId.operatingSystem}"></span></p>
                                                            <p> Processor:  <span th:text="${wishlist.productId.processor}"></span></p>
                                                        </div>
                                                    </td>
                                                    <td class="product-price" th:text="${wishlist.productId.price}"></td>
                                                    <td class="product-stock text-uppercase" th:if="${wishlist.productId.stockQuantity > 0}">In stock</td>
                                                    <td class="product-stock text-uppercase" th:unless="${wishlist.productId.stockQuantity > 0}">Out stock</td>
                                                    <td class="product-add-cart">
                                                        <a th:href="@{/user/carts/add-cart(id=${wishlist.productId.productId},quantity=${1})}" title="Add To Cart">
                                                            <i class="zmdi zmdi-shopping-cart-plus"></i>
                                                        </a>
                                                    </td>
                                                    <td class="product-remove">
                                                        <a th:href="@{/user/wishlists/delete-wishlist(productId=${wishlist.productId.productId})}"><i class="zmdi zmdi-close"></i></a>
                                                    </td>
                                                </tr>
                                                </tbody>
                                            </table>
                                        </div>
                                    </div>
                                </div>
                                <!-- wishlist end -->
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <!-- SHOP SECTION END -->             

        </section>
        <!-- End page content -->

        <!-- START FOOTER AREA -->
        <div th:replace="~{web/fragments/footer::footer}"></div>
        <!-- END FOOTER AREA -->

    </div>
    <!-- Body main wrapper end -->


    <!-- Placed JS at the end of the document so the pages load faster -->

    <!-- jquery latest version -->
    <div th:replace="~{web/fragments/script::script}"></div>


</body>

</html>
