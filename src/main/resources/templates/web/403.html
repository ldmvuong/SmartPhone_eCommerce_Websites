<!doctype html>
<html xmlns:th="https://www.thymeleaf.org">

<head th:replace="~{web/fragments/head::head}"></head>

<body>

    <!-- Body main wrapper start -->
    <div class="wrapper">

        <!-- START HEADER AREA -->
        <div th:replace="~{web/fragments/header::header}"></div>
        <!-- END HEADER AREA -->

        <!-- Start page content -->
        <div id="page-content" class="page-wrapper section">

            <!-- ERROR SECTION START -->
            <div class="error-section mb-80">
                <div class="container">
                    <div class="row">
                        <div class="col-lg-12">
                            <div class="error-404 box-shadow">
                                <img th:src="@{/web/img/others/error.jpg}" alt="">
                                <div class="go-to-btn btn-hover-2">
                                    <a th:href="@{/home}">go to home page</a>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <!-- ERROR SECTION END -->             

        </div>
        <!-- End page content -->

        <!-- START FOOTER AREA -->
        <div th:replace="~{web/fragments/footer::footer}"></div>
        <!-- END FOOTER AREA -->

    </div>
    <!-- Body main wrapper end -->

    <!-- Placed JS at the end of the document so the pages load faster -->
    <!-- jquery latest version -->
    <div th:replace="~{web/fragments/script::script}"></div>

</body>
</html>
