<!doctype html>
<html xmlns:th="https://www.thymeleaf.org">
<head th:replace="~{web/fragments/head::head}"></head>
<body>
<div class="wrapper">
    <div th:replace="~{web/fragments/header::header}"></div>

    <div id="page-content" class="page-wrapper section">
        <div class="login-section mb-80">
            <div class="container">
                <div class="row">
                    <!-- Đăng nhập -->
                    <div class="col-lg-6">
                        <div class="registered-customers">
                            <h6 class="widget-title border-left mb-50">LOGIN</h6>
                            <form th:action="@{/authenticateTheUser}" method="POST">
                                <div class="login-account p-30 box-shadow">
                                    <p>If you have an account with us, please log in.</p>
                                    <div th:if="${param.error}">
                                        <span style="color:red">Login failed, please check your username or password!</span>
                                    </div>
                                    <input type="text" name="username" placeholder="Username">
                                    <input type="password" name="password" placeholder="Password">
                                    <p><small><a href="#">Forgot your password?</a></small></p>
                                    <button class="submit-btn-1 btn-hover-1" type="submit">login</button>
                                </div>
                            </form>
                        </div>
                    </div>

                    <div class="col-lg-6">
                        <div class="new-customers">
                            <form th:action="@{/process}" th:object="${registerUser}" method="post">
                                <h6 class="widget-title border-left mb-50">NEW CUSTOMERS</h6>
                                <div class="login-account p-30 box-shadow">
                                    <div th:if="${param.registerSuccess}" style="color:green; font-weight:bold;">
                                        Đăng ký thành công! Bạn có thể đăng nhập ngay bây giờ.
                                    </div>
                                    <div th:if="${my_error != null}">
                                        <span style="color:red;" th:text="${my_error}"></span>
                                    </div>
                                    <div class="row">
                                        <div class="col-sm-6">
                                            <div th:if="${#fields.hasErrors('userName')}" th:errors="*{userName}" class="text-danger"></div>
                                            <input type="text" th:field="*{userName}" placeholder="Username">
                                        </div>
                                        <div class="col-sm-6">
                                            <div th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}" class="text-danger"></div>
                                            <input type="text" th:field="*{phone}" placeholder="Phone">
                                        </div>
                                        <div class="col-sm-6">
                                            <div th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}" class="text-danger"></div>
                                            <input type="text" th:field="*{firstName}" placeholder="First Name">
                                        </div>
                                        <div class="col-sm-6">
                                            <div th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}" class="text-danger"></div>
                                            <input type="text" th:field="*{lastName}" placeholder="Last Name">
                                        </div>
                                    </div>

                                    <div th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="text-danger"></div>
                                    <input type="text" th:field="*{email}" placeholder="Email address">

                                    <div th:if="${#fields.hasErrors('address')}" th:errors="*{address}" class="text-danger"></div>
                                    <input type="text" th:field="*{address}" placeholder="Address">

                                    <div th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="text-danger"></div>
                                    <input type="password" th:field="*{password}" placeholder="Password">

                                    <div th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}" class="text-danger"></div>
                                    <input type="password" th:field="*{confirmPassword}" placeholder="Confirm Password">

                                    <div class="row">
                                        <div class="col-md-6">
                                            <button class="submit-btn-1 mt-20 btn-hover-1" type="submit" value="register">Register</button>
                                        </div>
                                    </div>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{web/fragments/footer::footer}"></div>
</div>

<div th:replace="~{web/fragments/script::script}"></div>

</body>
</html>
