<!doctype html>
<html xmlns:th="https://www.thymeleaf.org">

<!-- Mirrored from htmldemo.net/subas/subas/404.html by HTTrack Website Copier/3.x [XR&CO'2014], Tue, 15 Oct 2024 02:16:37 GMT -->
<head th:replace="~{web/fragments/head::head}"></head>

<body>

<!-- Body main wrapper start -->
<div class="wrapper">

    <!-- START HEADER AREA -->
    <div th:replace="~{web/fragments/header::header}"></div>
    <!-- END HEADER AREA -->

    <!-- Start page content -->
    <div id="page-content" class="page-wrapper section">

        <!-- SHOP SECTION START -->
        <div class="shop-section mb-80">
            <div class="container">
                <div class="row">
                    <div class="col-lg-9 order-lg-1 order-1">
                        <div class="shop-content">
                            <!-- Tab Content start -->
                            <div class="tab-content">
                                <form th:action="@{/admin/add-category}" method="get" class="mb-30">
                                    <button class="submit-btn-1 black-bg btn-hover-2" type="submit">Add category</button>
                                </form>
                                <!-- list-view -->
                                <div id="list-view" class="tab-pane active show" role="tabpanel">
                                    <div class="row">
                                        <div th:each="category : ${categories}">
                                            <!-- category-item start -->
                                            <div class="col-lg-12">
                                                <div class="shop-list product-item">

                                                    <div class="product-info">
                                                        <div class="clearfix">
                                                            <h6 class="product-title f-left">
                                                                <a th:text="${category.categoryName}"> </a>
                                                            </h6>
                                                        </div>
                                                        <h6 class="brand-name mb-30">Description</h6>
                                                        <p th:text="${category.description}"></p> <!-- Hiển thị mô tả category -->

                                                        <ul class="action-button">
                                                            <li>
                                                                <a th:href="@{/admin/edit-category/{id}(id=${category.categoryId})}" title="Edit"><i
                                                                        class="zmdi zmdi-edit"></i></a>
                                                            </li>
                                                            <li>
                                                                <a th:href="@{/admin/delete-category/{id}(id=${category.categoryId})}" th:onclick="return confirm('Bạn có chắc chắn muốn xóa không?')" title="Delete"><i
                                                                        class="zmdi zmdi-delete"></i></a>
                                                            </li>
                                                        </ul>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <!-- Tab Content end -->
                            <!-- shop-pagination start -->
                            <div th:replace="~{web/product/product-pagination::pagination}"></div>
                            <!-- shop-pagination end -->
                        </div>
                    </div>
                    <!--                        START SIDEBAR-->
                    <div th:replace="~{web/blog/sidebar::sidebar}"></div>
                    <!--                        END SIDEBAR-->
                </div>
            </div>
        </div>
        <!-- SHOP SECTION END -->

    </div>
    <!-- End page content -->

    <!-- START FOOTER AREA -->
    <div th:replace="~{web/fragments/footer::footer}"></div>
    <!-- END FOOTER AREA -->

    <!-- START QUICKVIEW PRODUCT -->
    <div th:replace="~{web/product/quickviewProduct::quickview}"></div>
    <!-- END QUICKVIEW PRODUCT -->

</div>
<!-- Body main wrapper end -->


<!-- Placed JS at the end of the document so the pages load faster -->

<!-- jquery latest version -->
<div th:replace="~{web/fragments/script::script}"></div>


</body>


<!-- Mirrored from htmldemo.net/subas/subas/shop-list.html by HTTrack Website Copier/3.x [XR&CO'2014], Tue, 15 Oct 2024 02:16:37 GMT -->
</html>
