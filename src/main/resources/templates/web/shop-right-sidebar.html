<body>

<!-- Body main wrapper start -->
<div class="wrapper">

    <!-- START HEADER AREA -->

    <!-- END HEADER AREA -->

    <!-- Start page content -->
    <div id="page-content" class="page-wrapper section">

        <!-- SHOP SECTION START -->

            <div class="container">
                <div class="row">
                    <div class="col-lg-9 order-lg-1 order-1">

                            <div th:replace="~{web/product/product-page-option::product-option}"></div>

                            <!-- Tab Content start -->

                            <div th:replace="web/product/product-pagination::pagination"></div>

                    <!--                        END SIDEBAR-->
                </div>
            </div>
        </div>
        <!-- SHOP SECTION END -->

    </div>
    <!-- End page content -->

    <!-- START FOOTER AREA -->
    <div th:replace="~{web/fragments/footer::footer}"></div>
    <!-- END FOOTER AREA -->

    <!-- START QUICKVIEW PRODUCT -->
    <div th:replace="~{web/product/quickviewProduct::quickview}"></div>
    <!-- END QUICKVIEW PRODUCT -->
