<!-- Placed JS at the end of the document so the pages load faster -->
<!-- jquery latest version -->
<script>
    document.addEventListener("DOMContentLoaded", function () {
        // Lấy tất cả các phần tử sản phẩm
        const products = document.querySelectorAll(".product-item");

        products.forEach(product => {
            // Lấy giá trị rating từ input ẩn
            const ratingInput = product.querySelector(".rating");
            if (ratingInput) {
                const rating = parseFloat(ratingInput.value);
                console.log("Rating:", rating); // Kiểm tra giá trị rating trong console
                const ratingContainer = product.querySelector(".pro-rating");

                // Xóa nội dung trong `pro-rating` nếu có
                ratingContainer.innerHTML = '';

                // Tạo các icon sao dựa trên giá trị rating
                for (let i = 1; i <= 5; i++) {
                    const star = document.createElement("a");
                    star.href = "#";

                    if (i <= Math.floor(rating)) {
                        star.innerHTML = '<i class="zmdi zmdi-star"></i>'; // Sao đầy
                    } else if (i === Math.ceil(rating) && rating % 1 !== 0) {
                        star.innerHTML = '<i class="zmdi zmdi-star-half"></i>'; // Sao nửa
                    } else {
                        star.innerHTML = '<i class="zmdi zmdi-star-outline"></i>'; // Sao rỗng
                    }

                    // Thêm sao vào container
                    ratingContainer.appendChild(star);
                }
            }
        });
    });
</script>
