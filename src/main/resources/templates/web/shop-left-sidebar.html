<!doctype html>
<html xmlns:th="https://www.thymeleaf.org">

<head th:replace="~{web/fragments/head::head}"></head>

<body>

<!-- Body main wrapper start -->
<div class="wrapper">

    <!-- START HEADER AREA -->
    <header th:insert="~{web/fragments/header::header}"></header>
    <!-- END HEADER AREA -->

    <!-- Start page content -->
    <div id="page-content" class="page-wrapper section">

        <!-- SHOP SECTION START -->
        <div class="shop-section mb-80">
            <div class="container">
                <div class="row">
                    <div class="col-lg-9 order-lg-1 order-1">
                        <div class="shop-content">
                            <!-- shop-option start -->
                            <div class="shop-option box-shadow mb-30 clearfix">
                                <!-- Nav tabs -->
                                <ul class="nav shop-tab f-left" role="tablist">
                                    <li>
                                        <a class="active" href="#grid-view" data-bs-toggle="tab"><i
                                                class="zmdi zmdi-view-module"></i></a>
                                    </li>
                                    <li>
                                        <a href="#list-view" data-bs-toggle="tab"><i
                                                class="zmdi zmdi-view-list-alt"></i></a>
                                    </li>
                                </ul>
                                <!-- short-by -->
                                <div class="short-by f-left text-center">
                                    <span>Sort by:</span>
                                    <select onchange="window.location.href=this.value;">
                                        <!-- Sắp xếp theo "Price" -->
                                        <option value="#" th:selected="${sortBy == 'price' && sortOrder == 'asc'}"
                                                th:value="@{${baseUrl} + 'sortBy=price&sortOrder=asc'}"
                                                th:text="'Price: Low to High'"></option>
                                        <option value="#" th:selected="${sortBy == 'price' && sortOrder == 'desc'}"
                                                th:value="@{${baseUrl} + 'sortBy=price&sortOrder=desc'}"
                                                th:text="'Price: High to Low'"></option>

                                        <!-- Sắp xếp theo "Rating" -->
                                        <option value="#" th:selected="${sortBy == 'rating' && sortOrder == 'asc'}"
                                                th:value="@{${baseUrl} + 'sortBy=rating&sortOrder=asc'}"
                                                th:text="'Rating: Low to High'"></option>
                                        <option value="#" th:selected="${sortBy == 'rating' && sortOrder == 'desc'}"
                                                th:value="@{${baseUrl} + 'sortBy=rating&sortOrder=desc'}"
                                                th:text="'Rating: High to Low'"></option>
                                    </select>
                                </div>

                                <!-- showing -->
                                <div class="showing f-right text-end">
                                    <span th:text="${showingInfo}"></span>
                                </div>
                            </div>
                            <!-- shop-option end -->
                            <!-- Tab Content start -->
                            <div class="tab-content">
                                <!-- grid-view -->
                                <div id="grid-view" class="tab-pane active show" role="tabpanel">
                                    <div class="row">
                                        <!-- product-item start -->
                                        <div class="col-lg-4 col-md-6" th:each="product : ${products}">
                                            <div class="product-item">
                                                <div class="product-img">
                                                    <!--                                Duong dan toi single-product-->
                                                    <a th:href="@{/products/{id}(id=${product.productId})}">
                                                        <img th:src="@{|/${product.imagePath}|}" alt=""
                                                             style="width: 265px; height: 250px; object-fit: cover;"/>
                                                    </a>
                                                </div>
                                                <div class="product-info">
                                                    <h6 class="product-title">
                                                        <a th:href="@{/products/{id}(id=${product.productId})}"
                                                           th:text="${product.name}"></a>
                                                    </h6>
                                                    <input type="hidden" class="rating" th:value="${product.rating}">
                                                    <input type="hidden" name="id" th:value="${product.productId}">
                                                    <div class="pro-rating"></div>
                                                    <h3 class="pro-price" th:text="${product.price}"></h3>
                                                    <ul class="action-button">
                                                        <li>
                                                            <a th:href="@{/user/wishlists/add-wishlist(id=${product.productId})}" title="Wishlist" tabindex="0"><i
                                                                    class="zmdi zmdi-favorite"></i></a>
                                                        </li>
                                                        <li>
                                                            <a th:href="@{/user/carts/add-cart(id=${product.productId},quantity=${1})}"
                                                               title="Add to cart"><i
                                                                    class="zmdi zmdi-shopping-cart-plus"></i></a>
                                                        </li>
                                                    </ul>
                                                </div>
                                            </div>
                                        </div>
                                        <!-- product-item end -->
                                    </div>
                                </div>
                                <!-- list-view -->
                                <div id="list-view" class="tab-pane" role="tabpanel">
                                    <div class="row" th:each="product : ${products}">
                                        <!-- product-item start -->
                                        <div class="col-lg-12">
                                            <div class="shop-list product-item">
                                                <div class="product-img">
                                                    <a th:href="@{/products/{id}(id=${product.productId})}">
                                                        <img th:src="@{|/${product.imagePath}|}" alt=""
                                                             style="width: 295px; height: 240px; object-fit: cover;"/>
                                                    </a>
                                                </div>
                                                <div class="product-info">
                                                    <div class="clearfix">
                                                        <h6 class="product-title f-left">
                                                            <a th:href="@{/products/{id}(id=${product.productId})}"
                                                               th:text="${product.name}"> </a>
                                                        </h6>
                                                        <input type="hidden" class="rating"
                                                               th:value="${product.rating}">
                                                        <input type="hidden" name="id" th:value="${product.productId}">
                                                        <div class="pro-rating f-right"></div>
                                                    </div>
                                                    <h6 class="brand-name mb-30" th:text="${product.brandName}"></h6>
                                                    <h3 class="pro-price" th:text="${product.price}"></h3>
                                                    <p th:text="${product.description}"></p>
                                                    <ul class="action-button">
                                                        <li>
                                                            <a th:href="@{/user/wishlists/add-wishlist(id=${product.productId})}" title="Wishlist" tabindex="0"><i
                                                                    class="zmdi zmdi-favorite"></i></a>
                                                        </li>
                                                        <li>

                                                            <a th:href="@{/user/carts/add-cart(id=${product.productId},quantity=${1})}"
                                                               title="Add to cart"><i
                                                                    class="zmdi zmdi-shopping-cart-plus"></i></a>
                                                        </li>
                                                    </ul>
                                                </div>
                                            </div>
                                        </div>
                                        <!-- product-item end -->
                                    </div>
                                </div>
                            </div>                            <!-- Tab Content end -->
                            <!-- shop-pagination start -->
                            <div th:replace="web/product/product-pagination::pagination"></div>
                            <!-- shop-pagination end -->
                        </div>
                    </div>
                    <!--                        START SIDEBAR-->
                    <div class="col-lg-3">
                        <!-- Filter Form -->
                        <form action="/products" method="GET">
                            <!-- widget-search -->
                            <aside class="widget-search mb-30">
                                <input type="search" name="name" placeholder="Search here..." th:value="${param.name}">
                                <button type="submit"><i class="zmdi zmdi-search"></i></button>
                            </aside>

                            <!-- widget-categories (Brands) -->
                            <aside class="widget widget-categories box-shadow mb-30">
                                <h6 class="widget-title border-left mb-20">Brands</h6>
                                <div id="cat-treeview-2" class="brand-title">
                                    <div th:each="brand : ${brands}">
                                        <label>
                                            <input type="radio" name="brandName" th:value="${brand.name}"
                                                   th:checked="${param.brandName != null ? #strings.equals(param.brandName, brand.name) : false}">
                                            <span th:text="${brand.name}"></span>
                                        </label><br>
                                    </div>
                                </div>
                            </aside>

                            <!-- shop-filter (Price) -->
                            <!--                            <aside class="widget shop-filter box-shadow mb-30">-->
                            <!--                                <h6 class="widget-title border-left mb-20">Price</h6>-->
                            <!--                                <label for="minPrice">Min Price:</label>-->
                            <!--                                <input type="number" id="minPrice" name="minPrice" th:value="${param.minPrice}">-->
                            <!--                                <br>-->
                            <!--                                <label for="maxPrice">Max Price:</label>-->
                            <!--                                <input type="number" id="maxPrice" name="maxPrice" th:value="${param.maxPrice}">-->
                            <!--                            </aside>-->
                            <aside class="widget shop-filter box-shadow mb-30">
                                <h6 class="widget-title border-left mb-20">Price</h6>
                                <div class="price_filter">
                                    <div class="price_slider_amount">
                                        <input type="hidden" id="minPrice" name="minPrice"
                                               th:value="${param.minPrice != null ? param.minPrice : 1000000}"/>
                                        <input type="hidden" id="maxPrice" name="maxPrice"
                                               th:value="${param.maxPrice != null ? param.maxPrice : 50000000}"/>
                                        <input type="text" id="amount" readonly/>
                                    </div>
                                    <div id="slider-range"></div>
                                </div>
                            </aside>

                            <!-- Operating System -->
                            <aside class="widget operating-system box-shadow mb-30">
                                <h6 class="widget-title border-left mb-20">Operating System</h6>
                                <div>
                                    <label><input type="radio" name="operatingSystem" value="iOS"
                                                  th:checked="${param.operatingSystem != null ? #strings.equals(param.operatingSystem, 'iOS') : false}">
                                        iOS</label><br>
                                    <label><input type="radio" name="operatingSystem" value="MIUI"
                                                  th:checked="${param.operatingSystem != null ? #strings.equals(param.operatingSystem, 'MIUI') : false}">
                                        MIUI</label><br>
                                    <label><input type="radio" name="operatingSystem" value="ColorOS"
                                                  th:checked="${param.operatingSystem != null ? #strings.equals(param.operatingSystem, 'ColorOS') : false}">
                                        ColorOS</label><br>
                                    <label><input type="radio" name="operatingSystem" value="Funtouch OS"
                                                  th:checked="${param.operatingSystem != null ? #strings.equals(param.operatingSystem, 'Funtouch OS') : false}">
                                        Funtouch OS</label><br>
                                    <label><input type="radio" name="operatingSystem" value="Realme UI"
                                                  th:checked="${param.operatingSystem != null ? #strings.equals(param.operatingSystem, 'Realme UI') : false}">
                                        Realme UI</label><br>
                                    <label><input type="radio" name="operatingSystem" value="HarmonyOS"
                                                  th:checked="${param.operatingSystem != null ? #strings.equals(param.operatingSystem, 'HarmonyOS') : false}">
                                        HarmonyOS</label><br>
                                    <label><input type="radio" name="operatingSystem" value="EMUI"
                                                  th:checked="${param.operatingSystem != null ? #strings.equals(param.operatingSystem, 'EMUI') : false}">
                                        EMUI</label><br>
                                    <label><input type="radio" name="operatingSystem" value="Android"
                                                  th:checked="${param.operatingSystem != null ? #strings.equals(param.operatingSystem, 'Android') : false}">
                                        Android</label><br>
                                </div>
                            </aside>

                            <!-- SIM -->
                            <aside class="widget operating-system box-shadow mb-30">
                                <h6 class="widget-title border-left mb-20">Sim</h6>
                                <div>
                                    <label><input type="radio" name="sim" value="Nano SIM"
                                                  th:checked="${param.sim != null ? #strings.equals(param.sim, 'Nano SIM') : false}">
                                        Nano SIM</label><br>
                                    <label><input type="radio" name="sim" value="Micro SIM"
                                                  th:checked="${param.sim != null ? #strings.equals(param.sim, 'Micro SIM') : false}">
                                        Micro SIM</label><br>
                                    <label><input type="radio" name="sim" value="Mini SIM (Standard SIM)"
                                                  th:checked="${param.sim != null ? #strings.equals(param.sim, 'Mini SIM (Standard SIM)') : false}">
                                        Mini SIM (Standard SIM)</label><br>
                                    <label><input type="radio" name="sim" value="eSIM"
                                                  th:checked="${param.sim != null ? #strings.equals(param.sim, 'eSIM') : false}">
                                        eSIM</label><br>
                                    <label><input type="radio" name="sim" value="Dual SIM"
                                                  th:checked="${param.sim != null ? #strings.equals(param.sim, 'Dual SIM') : false}">
                                        Dual SIM</label><br>
                                    <label><input type="radio" name="sim" value="Hybrid SIM"
                                                  th:checked="${param.sim != null ? #strings.equals(param.sim, 'Hybrid SIM') : false}">
                                        Hybrid SIM</label><br>
                                </div>
                            </aside>


                            <!-- Connectivity -->
                            <aside class="widget operating-system box-shadow mb-30">
                                <h6 class="widget-title border-left mb-20">Connectivity</h6>
                                <div>
                                    <label><input type="radio" name="connectivity" value="Wi-Fi"
                                                  th:checked="${param.connectivity != null ? #strings.equals(param.connectivity, 'Wi-Fi') : false}">
                                        Wi-Fi</label><br>
                                    <label><input type="radio" name="connectivity" value="Bluetooth"
                                                  th:checked="${param.connectivity != null ? #strings.equals(param.connectivity, 'Bluetooth') : false}">
                                        Bluetooth</label><br>
                                    <label><input type="radio" name="connectivity" value="5G"
                                                  th:checked="${param.connectivity != null ? #strings.equals(param.connectivity, '5G') : false}">
                                        5G</label><br>
                                    <label><input type="radio" name="connectivity" value="4G LTE"
                                                  th:checked="${param.connectivity != null ? #strings.equals(param.connectivity, '4G LTE') : false}">
                                        4G LTE</label><br>
                                    <label><input type="radio" name="connectivity" value="NFC"
                                                  th:checked="${param.connectivity != null ? #strings.equals(param.connectivity, 'NFC') : false}">
                                        NFC</label><br>
                                </div>
                            </aside>

                            <!-- Clear Button -->
                            <a href="/products" class="btn btn-secondary">Clear</a>
                        </form>
                    </div>
                    <!--                        END SIDEBAR-->
                </div>
            </div>
        </div>
        <!-- SHOP SECTION END -->

    </div>
    <!-- End page content -->

    <!-- START FOOTER AREA -->
    <div th:replace="~{web/fragments/footer::footer}"></div>
    <!-- END FOOTER AREA -->

    <!-- START QUICKVIEW PRODUCT -->
    <div th:replace="~{web/product/quickviewProduct::quickview}"></div>
    <!-- END QUICKVIEW PRODUCT -->

</div>
<!-- Body main wrapper end -->

<!-- Placed JS at the end of the document so the pages load faster -->
<!-- jquery latest version -->
<script>
    document.addEventListener("DOMContentLoaded", function () {
        // Lấy tất cả các phần tử sản phẩm
        const products = document.querySelectorAll(".product-item");

        products.forEach(product => {
            // Lấy giá trị rating từ input ẩn
            const ratingInput = product.querySelector(".rating");
            if (ratingInput) {
                const rating = parseFloat(ratingInput.value);
                console.log("Rating:", rating); // Kiểm tra giá trị rating trong console
                const ratingContainer = product.querySelector(".pro-rating");

                // Xóa nội dung trong `pro-rating` nếu có
                ratingContainer.innerHTML = '';

                // Tạo các icon sao dựa trên giá trị rating
                for (let i = 1; i <= 5; i++) {
                    const star = document.createElement("a");
                    star.href = "#";

                    if (i <= Math.floor(rating)) {
                        star.innerHTML = '<i class="zmdi zmdi-star"></i>'; // Sao đầy
                    } else if (i === Math.ceil(rating) && rating % 1 !== 0) {
                        star.innerHTML = '<i class="zmdi zmdi-star-half"></i>'; // Sao nửa
                    } else {
                        star.innerHTML = '<i class="zmdi zmdi-star-outline"></i>'; // Sao rỗng
                    }

                    // Thêm sao vào container
                    ratingContainer.appendChild(star);
                }
            }
        });
    })
</script>
<div th:replace="~{web/fragments/script::script}"></div>

</body>

</html>
