<!doctype html>
<html xmlns:th="https://www.thymeleaf.org">

<!-- Mirrored from htmldemo.net/subas/subas/404.html by HTTrack Website Copier/3.x [XR&CO2014], Tue, 15 Oct 2024 02:16:37 GMT -->
<head th:replace="~{web/fragments/head::head}"></head>

<body>

    <!-- Body main wrapper start -->
    <div class="wrapper">

        <!-- START HEADER AREA -->
        <div th:replace="~{web/fragments/header::header}"></div>
        <!-- END HEADER AREA -->

        <!-- Start page content -->
        <section id="page-content" class="page-wrapper section">

            <!-- SHOP SECTION START -->
            <div class="shop-section mb-80">
                <div class="container">
                    <div class="row">
                        <div class="col-lg-12">
                            <!-- Tab panes -->
                            <div class="tab-content">
                                <!-- shopping-cart start -->
                                <div class="tab-pane active" id="shopping-cart">
                                    <div class="shopping-cart-content">
                                        <form action="/user/carts/update-cart" method="post">
                                            <div class="table-content table-responsive mb-50">
                                                <table class="text-center">
                                                    <thead>
                                                    <tr>
                                                        <th></th>
                                                        <th class="product-thumbnail">product</th>
                                                        <th class="product-price">price</th>
                                                        <th class="product-quantity">Quantity</th>
                                                        <th class="product-subtotal">total</th>
                                                        <th class="product-remove">remove</th>
                                                    </tr>
                                                    </thead>
                                                    <tbody>
                                                    <!-- tr -->
                                                    <tr th:each="cartDetail : ${cartDetailListFull}">
                                                        <td>
                                                            <input type="checkbox" name="operating-1" value="phone-1">
                                                        </td>
                                                        <td class="product-thumbnail">
                                                            <div class="pro-thumbnail-img">
                                                                <img th:src="@{|/${cartDetail.productId.imagePath}|}" alt="">
                                                            </div>
                                                            <div class="pro-thumbnail-info text-start">
                                                                <h6 class="product-title-2">
                                                                    <a href="#" th:text="${cartDetail.productId.name}"></a>
                                                                </h6>
                                                                <p>Brand: <span th:text="${cartDetail.productId.brand.name}"></span></p>
                                                                <p>Operating system: <span th:text="${cartDetail.productId.operatingSystem}"></span></p>
                                                                <p> Processor: <span th:text="${cartDetail.productId.processor}"></span></p>
                                                            </div>
                                                            <input type="hidden" th:text="${cartDetail.productId}" name="productId">
                                                        </td>
                                                        <td class="product-price" th:text="${cartDetail.productId.price}"></td>
                                                        <td class="product-quantity">
                                                            <div class="cart-plus-minus f-left">
                                                                <form th:action="@{/user/carts/dec-cart}" method="post">
                                                                    <input type="hidden" name="productId" th:value="${cartDetail.productId.productId}"/>
                                                                    <button type="submit" class="dec qtybutton">-</button>
                                                                </form>
                                                                <input type="number" class="cart-plus-minus-box" name="qtybutton" th:value="${cartDetail.quantity}" readonly>
                                                                <form th:action="@{/user/carts/inc-cart}" method="post">
                                                                    <input type="hidden" name="productId" th:value="${cartDetail.productId.productId}" />
                                                                    <button type="submit" class="inc qtybutton">+</button>
                                                                </form>
                                                            </div>
                                                        </td>
                                                        <td id="product-subtotal-${cartDetail.productId.productId}" class="product-subtotal">
                                                            <span th:text="${cartDetail.cartPrice}"></span>
                                                        </td>
                                                        <td class="product-remove">
                                                            <a th:href="@{/user/carts/delete-cart(productId=${cartDetail.productId.productId})}"><i class="zmdi zmdi-close"></i></a>
                                                        </td>
                                                    </tr>
                                                    <div class="bot">
                                                        <div></div>
                                                        <button class="tf-button w208" type="submit">Save</button>
                                                    </div>
                                                    </tbody>
                                                </table>
                                            </div>
                                        </form>
                                    </div>
                                </div>
                                <!-- shopping-cart end -->
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <!-- SHOP SECTION END -->             

        </section>
        <!-- End page content -->

        <!-- START FOOTER AREA -->
        <div th:replace="~{web/fragments/footer::footer}"></div>
        <!-- END FOOTER AREA -->

    </div>
    <!-- Body main wrapper end -->

    <!-- Placed JS at the end of the document so the pages load faster -->
    <!-- jquery latest version -->

    <div th:replace="~{web/fragments/script::script}"></div>

</body>

</html>
