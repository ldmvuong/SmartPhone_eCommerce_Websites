<!doctype html>
<html xmlns:th="https://www.thymeleaf.org">

<!-- Mirrored from htmldemo.net/subas/subas/404.html by HTTrack Website Copier/3.x [XR&CO'2014], Tue, 15 Oct 2024 02:16:37 GMT -->
<head th:replace="~{web/fragments/head::head}"></head>

<body>

    <!-- Body main wrapper start -->
    <div class="wrapper">

        <!-- START HEADER AREA -->
        <div th:replace="~{web/fragments/header::header}"></div>
        <!-- END HEADER AREA -->

        <!-- Start page content -->
        <section id="page-content" class="page-wrapper section">

            <!-- SHOP SECTION START -->
            <div class="shop-section mb-80">
                <div class="container">
                    <div class="row">
                        <div th:replace="~{web/cart/shopping-section::shopping-section}"></div>
                        <div class="col-lg-10">
                            <!-- Tab panes -->
                            <div class="tab-content">
                                <!-- shopping-cart start -->
                                <div class="tab-pane active" id="shopping-cart">
                                    <div class="shopping-cart-content">
                                        <form action="#">
                                            <div th:replace="~{web/cart/shopping-cart::shopping-cart}"></div>
                                            <div class="row">
                                                <div th:replace="~{web/cart/voucher::voucher}"></div>
                                                <div th:replace="~{web/cart/shipping::shipping}"></div>
                                            </div>
                                            <div class="row">
                                                <div th:replace="~{web/cart/total::total}"></div>
                                            </div>
                                        </form>
                                    </div>
                                </div>
                                <!-- shopping-cart end -->
                                <!-- checkout start -->
                                <div class="tab-pane fade" id="checkout">
                                    <div class="checkout-content box-shadow p-30">
                                        <form action="#">
                                            <div class="row">
                                                <!-- billing details -->
                                                <div th:replace="~{web/cart/purchaser_inf::purchaser-inf}"></div>
                                                <div class="col-md-6">
                                                    <!-- our order -->
                                                    <div th:replace="~{web/order/order_detail::order-detail}"></div>
                                                    <!-- payment-method -->
                                                    <div th:replace="~{web/order/payment_method::payment-method}"></div>
                                                    <!-- payment-method end -->
                                                    <button class="submit-btn-1 mt-30 btn-hover-1" type="submit">place order</button>
                                                </div>
                                            </div>
                                        </form>
                                    </div>
                                </div>
                                <!-- checkout end -->
                                <!-- order-complete start -->
                                <div class="tab-pane fade" id="order-complete">
                                    <div class="order-complete-content box-shadow p-30">
                                        <form action="#">
                                            <div class="row">
                                                <div th:replace="~{web/order/order-complete::order-complete}"></div>
                                            </div>
                                        </form>
                                    </div>
                                </div>
                                <!-- order-complete end -->
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <!-- SHOP SECTION END -->             

        </section>
        <!-- End page content -->

        <!-- START FOOTER AREA -->
        <div th:replace="~{web/fragments/footer::footer}"></div>
        <!-- END FOOTER AREA -->

    </div>
    <!-- Body main wrapper end -->

    <!-- Placed JS at the end of the document so the pages load faster -->
    <!-- jquery latest version -->
    <div th:replace="~{web/fragments/script::script}"></div>

</body>

</html>
