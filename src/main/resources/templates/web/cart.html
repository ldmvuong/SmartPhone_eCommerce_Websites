    <!doctype html>
<html xmlns:th="https://www.thymeleaf.org">
<head th:replace="~{web/fragments/head::head}"></head>

<body>

    <!-- Body main wrapper start -->
    <div class="wrapper">

        <!-- START HEADER AREA -->
        <div th:replace="~{web/fragments/header::header}"></div>
        <!-- END HEADER AREA -->

        <!-- Start page content -->
        <section id="page-content" class="page-wrapper section">

            <!-- SHOP SECTION START -->
            <div class="shop-section mb-80">
                <div class="container">
                    <div class="row">
                        <div class="col-lg-12">
                            <!-- Tab panes -->
                            <div class="tab-content">
                                <!-- shopping-cart start -->
                                <div class="tab-pane active" id="shopping-cart">
                                    <div class="shopping-cart-content">
                                        <div class="table-content table-responsive mb-50">
                                            <form th:action="@{/user/checkout}" method="get" id="checkoutForm">
                                                <table class="text-center">
                                                    <thead>
                                                    <button type="button" id="selectAllButton" class="btn btn-outline-secondary">Buy All</button>
                                                    <tr>
                                                        <th></th>
                                                        <th class="product-thumbnail">product</th>
                                                        <th class="product-price">price</th>
                                                        <th class="product-quantity">Quantity</th>
                                                        <th class="product-subtotal">total</th>
                                                        <th class="product-remove">remove</th>
                                                    </tr>
                                                    </thead>
                                                    <tbody>
                                                    <!-- tr -->
                                                    <tr th:each="cartDetail : ${cartDetailListFull}">
                                                        <td class="product-checkbox">
                                                            <div class="checkbox-container">
                                                                <input type="checkbox"
                                                                       th:id="'brand-' + ${cartDetail.productId.productId}"
                                                                       class="product-checkbox"
                                                                       th:name="selectedProducts"
                                                                       th:value="${cartDetail.productId.productId}" />
                                                                <label th:for="'brand-' + ${cartDetail.productId.productId}" class="checkbox-label"></label>
                                                            </div>
                                                        </td>
<!--                                                        <td>-->
<!--                                                            <input type="checkbox" name="operating-1" value="phone-1">-->
<!--                                                        </td>-->
                                                        <td class="product-thumbnail">
                                                            <div class="pro-thumbnail-img">
                                                                <img th:src="@{|/${cartDetail.productId.imagePath}|}" alt="">
                                                            </div>
                                                            <div class="pro-thumbnail-info text-start">
                                                                <h6 class="product-title-2">
                                                                    <a th:href="@{/products/{id}(id=${cartDetail.productId.productId})}" th:text="${cartDetail.productId.name}"></a>
                                                                </h6>
                                                                <p>Brand: <span th:text="${cartDetail.productId.brand.name}"></span></p>
                                                                <p>Operating system: <span th:text="${cartDetail.productId.operatingSystem}"></span></p>
                                                                <p> Processor: <span th:text="${cartDetail.productId.processor}"></span></p>
                                                            </div>
                                                        </td>
                                                        <td class="product-price" th:text="${cartDetail.productId.price}"></td>
                                                        <td class="product-quantity">
                                                            <div class="cart-plus-minus f-left">
                                                                <a th:href="@{/user/carts/dec-cart(productId=${cartDetail.productId.productId})}" class="dec qtybutton">-</a>
<!--                                                                <form th:action="@{/user/carts/dec-cart}" method="post" style="display: inline;">-->
<!--                                                                    <input type="hidden" name="productId" th:value="${cartDetail.productId.productId}"/>-->
<!--                                                                    <button type="submit" class="dec qtybutton">-</button>-->
<!--                                                                </form>-->
                                                                <input type="number" class="cart-plus-minus-box" name="qtybutton" th:value="${cartDetail.quantity}" readonly>
                                                                <a th:href="@{/user/carts/inc-cart(productId=${cartDetail.productId.productId})}" class="inc qtybutton">+</a>
<!--                                                                <form th:action="@{/user/carts/inc-cart}" method="post" style="display: inline;">-->
<!--                                                                    <input type="hidden" name="productId" th:value="${cartDetail.productId.productId}" />-->
<!--                                                                    <button type="submit" class="inc qtybutton">+</button>-->
<!--                                                                </form>-->
                                                            </div>
                                                        </td>
                                                        <td id="product-subtotal-${cartDetail.productId.productId}" class="product-subtotal">
                                                            <span th:text="${cartDetail.cartPrice}"></span>
                                                        </td>
                                                        <td class="product-remove">
                                                            <a th:href="@{/user/carts/delete-cart(productId=${cartDetail.productId.productId})}"><i class="zmdi zmdi-close"></i></a>
                                                        </td>
                                                    </tr>
                                                    </tbody>
                                                </table>
                                                <div class="bot">
                                                    <button id="checkoutButton" type="submit" class="btn btn-primary" style="display: none;">Checkout</button>
                                                </div>
                                            </form>
                                        </div>
                                    </div>
                                </div>
                                <!-- shopping-cart end -->

                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <!-- SHOP SECTION END -->             

        </section>
        <!-- End page content -->

        <!-- START FOOTER AREA -->
        <div th:replace="~{web/fragments/footer::footer}"></div>
        <!-- END FOOTER AREA -->

    </div>
    <!-- Body main wrapper end -->

    <!-- Placed JS at the end of the document so the pages load faster -->
    <!-- jquery latest version -->

    <div th:replace="~{web/fragments/script::script}"></div>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const checkboxes = document.querySelectorAll('input[type="checkbox"][name="selectedProducts"]');
            const checkoutButton = document.getElementById('checkoutButton');
            const selectAllButton = document.getElementById('selectAllButton');

            function toggleCheckoutButton() {
                // Kiểm tra nếu có ít nhất 1 checkbox được chọn
                const isChecked = Array.from(checkboxes).some(checkbox => checkbox.checked);
                checkoutButton.style.display = isChecked ? 'block' : 'none'; // Hiển thị/ẩn nút checkout
            }

            // Gắn sự kiện thay đổi cho tất cả các checkbox
            checkboxes.forEach(checkbox => {
                checkbox.addEventListener('change', toggleCheckoutButton);
            });

            // Gắn sự kiện cho nút "Mua tất cả"
            selectAllButton.addEventListener('click', function () {
                checkboxes.forEach(checkbox => {
                    checkbox.checked = true; // Chọn tất cả các checkbox
                });
                toggleCheckoutButton(); // Cập nhật lại trạng thái nút checkout
            });

            // Gọi lần đầu để xác định trạng thái nút checkout khi load trang
            toggleCheckoutButton();
        });
    </script>
    <script>

            const checkoutButton = document.getElementById('checkoutButton');

            });

            // Gọi lần đầu để xác định trạng thái nút checkout khi load trang
            toggleCheckoutButton();
        });
    </script>

</body>
</html>
