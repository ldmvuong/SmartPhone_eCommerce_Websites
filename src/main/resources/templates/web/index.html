<!doctype html>
<html xmlns:th="https://www.thymeleaf.org">

<!-- Mirrored from htmldemo.net/subas/subas/index.html by HTTrack Website Copier/3.x [XR&CO'2014], Tue, 15 Oct 2024 02:15:42 GMT -->
<head th:replace="~{web/fragments/head::head}"></head>

<body>

<!-- Body main wrapper start -->
<div class="wrapper">

    <!-- START HEADER AREA -->
    <header th:insert="~{web/fragments/header::header}"></header>
    <!-- END HEADER AREA -->

    <!-- START SLIDER AREA -->
    <div th:replace="~{web/fragments/slidebar::slidebar}"></div>
    <!-- END SLIDER AREA -->

    <!-- Start page content -->
    <section id="page-content" class="page-wrapper section">

        <!-- BY BRAND SECTION START-->
        <div class="by-brand-section mb-80">
            <div class="container">
                <div class="row">
                    <div class="col-md-12">
                        <div class="section-title text-start mb-40">
                            <h2 class="uppercase">By Brands</h2>
                            <h6>
                                There are many variations of passages of brands available,
                            </h6>
                        </div>
                        <div class="by-brand-product">
                            <div class="active-by-brand slick-arrow-2">
                                <!-- single-brand-product start -->
                                <div class="brand-item" th:each="brand : ${brands}">
                                    <div class="single-brand-product">
                                        <a th:href="@{/products(brand=${brand.name})}">
                                            <img th:src="@{|/${brand.img}|}" alt="" style="width: 250px; height: 300px; object-fit: cover;" />
                                        </a>
                                        <h3 class="brand-title text-gray">
                                            <a th:href="@{/products(brand=${brand.name})}" th:text="${brand.name}"></a>
                                        </h3>
                                    </div>
                                </div>
                                <!-- single-brand-product end -->
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <!-- BY BRAND SECTION END -->

        <!-- FEATURED PRODUCT SECTION START -->
        <div class="featured-product-section mb-50" >
            <div class="container">
                <div class="row">
                    <div class="col-lg-12">
                        <div class="section-title text-center mb-50">
                            <h2 class="uppercase">Featured product</h2>
                            <h6>There are many variations of passages of brands available,</h6>
                        </div>
                        <div class="featured-product">
                            <div class="active-featured-product slick-arrow-2">
                                <div th:replace="~{web/product/product-item::product-item}"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <!-- FEATURED PRODUCT SECTION END -->

        <!-- PRODUCT TAB SECTION START -->
        <div class="product-tab-section mb-50">
            <div class="container">
                <div class="row">
                    <div class="col-lg-6">
                        <div class="section-title text-start mb-40">
                            <h2 class="uppercase">product list</h2>
                            <h6>There are many variations of passages of brands available,</h6>
                        </div>
                    </div>
                    <div class="col-lg-6">
                        <div class="product-tab pro-tab-menu text-end">
                            <!-- Nav tabs -->
                            <ul class="nav" >
                                <li><a class="active" href="#new-arrival" data-bs-toggle="tab">New Arrival</a></li>
                                <li><a href="#best-seller"  data-bs-toggle="tab">Best Seller</a></li>
                            </ul>
                        </div>
                    </div>
                    <div class="col-lg-12">
                        <!-- Tab panes -->
                        <div class="tab-content">
                            <!-- new-arrival start -->
                            <div id="new-arrival" class="tab-pane active show">
                                <div class="row">
                                    <!-- product-item start -->
                                    <div class="col-lg-3 col-md-4" th:each="product : ${newArrivalProducts}">
                                        <div class="product-item">
                                            <div class="product-img">
                                                <a th:href="@{/products/{id}(id=${product.productId})}">
                                                    <img th:src="@{|/${product.imagePath}|}" alt="" style="width: 265px; height: 250px; object-fit: cover;" />
                                                </a>
                                            </div>
                                            <div class="product-info">
                                                <h6 class="product-title">
                                                    <a th:href="@{/products/{id}(id=${product.productId})}" th:text="${product.name}"></a>
                                                </h6>
                                                <input type="hidden" class="rating" th:value="${product.rating}">
                                                <input type="hidden" name="id" th:value="${product.productId}">
                                                <div class="pro-rating"></div>
                                                <h3 class="pro-price" th:text="${product.price}"></h3>
                                                <input type="hidden" name="quantity" th:value="1">
                                                <ul class="action-button">
<!--                                                    <li>-->
<!--                                                        <a th:href="@{/products/quick-view/{id}(id=${product.productId})}" data-bs-toggle="modal"  data-bs-target="#productModal" title="Quickview"><i class="zmdi zmdi-zoom-in"></i></a>-->
<!--                                                    </li>-->
                                                    <li>
                                                        <a th:href="@{/user/carts/add-cart(id=${product.productId},quantity=${1})}" title="Add to cart"><i class="zmdi zmdi-shopping-cart-plus"></i></a>
                                                    </li>
                                                </ul>
                                            </div>
                                        </div>
                                    </div>
                                    <!-- product-item end -->
                                </div>
                            </div>
                            <!-- new-arrival end -->
                            <!-- best-seller start -->
                            <div id="best-seller" class="tab-pane" role="tabpanel">
                                <div class="row">
                                    <!-- product-item start -->
                                    <div class="col-lg-3 col-md-4">
                                        <div th:replace="~{web/product/product-item::product-item}"></div>
                                    </div>
                                    <!-- product-item end -->
                                </div>
                            </div>
                            <!-- best-seller end -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <!-- PRODUCT TAB SECTION END -->
    </section>
    <!-- End page content -->

    <!-- START FOOTER AREA -->
    <div th:replace="~{web/fragments/footer::footer}"></div>
    <!-- END FOOTER AREA -->

<!--    &lt;!&ndash; START QUICKVIEW PRODUCT &ndash;&gt;-->
<!--    <div th:replace="~{web/product/quickviewProduct::quickview}"></div>-->
<!--    &lt;!&ndash; END QUICKVIEW PRODUCT &ndash;&gt;-->

</div>
<!-- Body main wrapper end -->

<!-- Placed JS at the end of the document so the pages load faster -->
<!-- jquery latest version -->
<script>
    document.addEventListener("DOMContentLoaded", function () {
        // Lấy tất cả các phần tử sản phẩm
        const products = document.querySelectorAll(".product-item");

        products.forEach(product => {
            // Lấy giá trị rating từ input ẩn
            const ratingInput = product.querySelector(".rating");
            if (ratingInput) {
                const rating = parseFloat(ratingInput.value);
                console.log("Rating:", rating); // Kiểm tra giá trị rating trong console
                const ratingContainer = product.querySelector(".pro-rating");

                // Xóa nội dung trong `pro-rating` nếu có
                ratingContainer.innerHTML = '';

                // Tạo các icon sao dựa trên giá trị rating
                for (let i = 1; i <= 5; i++) {
                    const star = document.createElement("a");
                    star.href = "#";

                    if (i <= Math.floor(rating)) {
                        star.innerHTML = '<i class="zmdi zmdi-star"></i>'; // Sao đầy
                    } else if (i === Math.ceil(rating) && rating % 1 !== 0) {
                        star.innerHTML = '<i class="zmdi zmdi-star-half"></i>'; // Sao nửa
                    } else {
                        star.innerHTML = '<i class="zmdi zmdi-star-outline"></i>'; // Sao rỗng
                    }

                    // Thêm sao vào container
                    ratingContainer.appendChild(star);
                }
            }
        });
    });
</script>
