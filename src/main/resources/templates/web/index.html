<!doctype html>
<html xmlns:th="https://www.thymeleaf.org">

<head th:replace="~{web/fragments/head::head}"></head>

<body>

<!-- Body main wrapper start -->
<div class="wrapper">

    <!-- START HEADER AREA -->
    <div th:replace="~{web/fragments/header::header}"></div>
    <!-- END HEADER AREA -->

    <!-- START SLIDER AREA -->
    <div th:replace="~{web/fragments/slidebar::slidebar}"></div>
    <!-- END SLIDER AREA -->

    <!-- Start page content -->
    <section id="page-content" class="page-wrapper section">

        <!-- BY BRAND SECTION START-->
        <div th:replace="~{web/fragments/brand::brand}"></div>
        <!-- BY BRAND SECTION END -->

        <!-- FEATURED PRODUCT SECTION START -->
        <div th:replace="~{web/product/featureProduct::featureProduct}"></div>
        <!-- FEATURED PRODUCT SECTION END -->

        <!-- PRODUCT TAB SECTION START -->
        <div th:replace="~{web/product/productList::productList}"></div>
        <!-- PRODUCT TAB SECTION END -->
    </section>
    <!-- End page content -->

    <!-- START FOOTER AREA -->
    <div th:replace="~{web/fragments/footer::footer}"></div>
    <!-- END FOOTER AREA -->

    <!-- START QUICKVIEW PRODUCT -->
    <div th:replace="~{web/product/quickviewProduct::quickview}"></div>
    <!-- END QUICKVIEW PRODUCT -->

</div>
<!-- Body main wrapper end -->

<!-- Placed JS at the end of the document so the pages load faster -->
<!-- jquery latest version -->
<div th:replace="~{web/fragments/script::script}"></div>

</body>
