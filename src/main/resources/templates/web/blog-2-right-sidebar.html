<!doctype html>
<html xmlns:th="https://www.thymeleaf.org">

<head th:replace="~{web/fragments/head::head}"></head>

<body>

<!-- Body main wrapper start -->
<div class="wrapper">

    <!-- START HEADER AREA -->
    <div th:replace="~{web/fragments/header::header}"></div>
    <!-- END HEADER AREA -->

    <!-- Start page content -->
    <div id="page-content" class="page-wrapper section">

        <!-- BLOG SECTION START -->
        <div class="blog-section mb-50">
            <div class="container">
                <div class="row">
                    <div class="col-lg-9">
                        <div class="row">
                            <!-- blog-option start -->
                            <div class="col-lg-12">
                                <div class="blog-option box-shadow mb-30  clearfix">
                                    <!-- categories -->
                                    <div class="dropdown f-left">
                                        <button class="option-btn">
                                            Categories
                                            <i class="zmdi zmdi-chevron-down"></i>
                                        </button>
                                        <div class="dropdown-menu dropdown-width mt-30" >
                                            <div th:replace="~{web/categories/list-category::list-category}"></div>
                                        </div>
                                    </div>
                                    <!-- recent-product -->
                                    <div class="dropdown f-left">
                                        <button class="option-btn">
                                            Recent Post
                                            <i class="zmdi zmdi-chevron-down"></i>
                                        </button>
                                        <div class="dropdown-menu dropdown-width mt-30">
                                            <aside class="widget widget-product box-shadow">
                                                <h6 class="widget-title border-left mb-20">recent products</h6>
                                                <!-- product-item start -->
                                                <div class="product-item">
                                                    <div class="product-img">
                                                        <a href="single-product.html">
                                                            <img th:src="@{/web/img/cart/4.jpg}" alt="" />
                                                        </a>
                                                    </div>
                                                    <div class="product-info">
                                                        <h6 class="product-title multi-line mt-10">
                                                            <a href="single-product.html">Dummy Blog Name</a>
                                                        </h6>
                                                    </div>
                                                </div>
                                                <!-- product-item end -->
                                            </aside>
                                        </div>
                                    </div>
                                    <!-- Tags -->
                                    <div class="dropdown f-left">
                                        <button class="option-btn">
                                            Tags
                                            <i class="zmdi zmdi-chevron-down"></i>
                                        </button>
                                        <div class="dropdown-menu dropdown-width mt-30">
                                            <aside class="widget widget-tags box-shadow">
                                                <h6 class="widget-title border-left mb-20">Tags</h6>
                                                <ul class="widget-tags-list">
                                                    <li><a href="#">Bleckgerry ios</a></li>
                                                    <li><a href="#">Symban</a></li>
                                                    <li><a href="#">IOS</a></li>
                                                    <li><a href="#">Bleckgerry</a></li>
                                                    <li><a href="#">Windows Phone</a></li>
                                                    <li><a href="#">Windows Phone</a></li>
                                                    <li><a href="#">Androids</a></li>
                                                </ul>
                                            </aside>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <!-- blog-option end -->
                        </div>
                        <div class="row">
                            <!-- blog-item start -->
                            <!-- blog-item start -->
                            <div class="col-md-6">
                                <div class="blog-item-2">
                                    <div class="row">
                                        <div class="col-lg-12">
                                            <div class="blog-image">
                                                <a href="single-blog.html"><img th:src="@{/web/img/blog/4.jpg}" alt=""></a>
                                            </div>
                                        </div>
                                        <div class="col-lg-12">
                                            <div class="blog-desc">
                                                <h5 class="blog-title-2"><a href="#">dummy Blog name</a></h5>
                                                <p>There are many variations of passages of in psum available, but the
                                                    majority have sufe ered on in some form...</p>
                                                <div class="read-more">
                                                    <a href="#">Read more</a>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <!-- blog-item end -->                            <!-- blog-item end -->
                        </div>
                    </div>
                    <!-- sidebar -->
                    <div th:replace="~{web/blog/sidebar::sidebar}"></div>
                </div>
            </div>
        </div>
        <!-- BLOG SECTION END -->

    </div>
    <!-- End page content -->

    <!-- START FOOTER AREA -->
    <div th:replace="~{web/fragments/footer::footer}"></div>
    <!-- END FOOTER AREA -->

</div>
<!-- Body main wrapper end -->

<!-- Placed JS at the end of the document so the pages load faster -->
<!-- jquery latest version -->
<div th:replace="~{web/fragments/script::script}"></div>

</body>
</html>
