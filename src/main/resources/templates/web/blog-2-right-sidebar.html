<!doctype html>
<html xmlns:th="https://www.thymeleaf.org">

<!-- Mirrored from htmldemo.net/subas/subas/404.html by HTTrack Website Copier/3.x [XR&CO'2014], Tue, 15 Oct 2024 02:16:37 GMT -->
<head th:replace="~{web/fragments/head::head}"></head>

<body>

<!-- Body main wrapper start -->
<div class="wrapper">

    <!-- START HEADER AREA -->
    <div th:replace="~{web/fragments/header::header}"></div>
    <!-- END HEADER AREA -->

    <!-- Start page content -->
    <div id="page-content" class="page-wrapper section">

        <!-- BLOG SECTION START -->
        <div class="blog-section mb-50">
            <div class="container">
                <div class="row">
                    <div class="col-lg-9">
                        <div class="row">
                            <!-- blog-option start -->
                            <div class="col-lg-12">
                                <div class="blog-option box-shadow mb-30  clearfix">
                                    <!-- categories -->
                                    <div class="dropdown f-left" th:fragment="list-category">
                                        <button class="option-btn">
                                            Categories
                                            <i class="zmdi zmdi-chevron-down"></i>
                                        </button>
                                        <div class="dropdown-menu dropdown-width mt-30" >
                                            <div th:replace="~{web/categories/list-category::list-category}"></div>
                                        </div>
                                    </div>
                                    <!-- recent-product -->
                                    <div th:replace="~{web/product/recent-product::recent-product}"></div>
                                    <!-- Tags -->
                                    <div th:replace="~{web/categories/os::os}"></div>
                                </div>
                            </div>
                            <!-- blog-option end -->
                        </div>
                        <div class="row">
                            <!-- blog-item start -->
                            <div th:replace="~{web/blog/blog-item::blog-item}"></div>
                            <!-- blog-item end -->
                        </div>
                    </div>
                    <!-- sidebar -->
                    <div th:replace="~{web/blog/sidebar::sidebar}"></div>
                </div>
            </div>
        </div>
        <!-- BLOG SECTION END -->

    </div>
    <!-- End page content -->

    <!-- START FOOTER AREA -->
    <div th:replace="~{web/fragments/footer::footer}"></div>
    <!-- END FOOTER AREA -->

</div>
<!-- Body main wrapper end -->

<!-- Placed JS at the end of the document so the pages load faster -->
<!-- jquery latest version -->
<div th:replace="~{web/fragments/script::script}"></div>

</body>
