<div class="product-tab-section mb-50" th:fragment="productList">
    <div class="container">
        <div class="row">
            <div class="col-lg-6">
                <div class="section-title text-start mb-40">
                    <h2 class="uppercase">product list</h2>
                    <h6>There are many variations of passages of brands available,</h6>
                </div>
            </div>
            <div class="col-lg-6">
                <div class="product-tab pro-tab-menu text-end">
                    <!-- Nav tabs -->
                    <ul class="nav" >
                        <li><a class="active" href="#popular-product" data-bs-toggle="tab">Popular Products </a></li>
                        <li><a href="#new-arrival" data-bs-toggle="tab">New Arrival</a></li>
                        <li><a href="#best-seller"  data-bs-toggle="tab">Best Seller</a></li>
                        <li><a href="#special-offer"  data-bs-toggle="tab">Special Offer</a></li>
                    </ul>
                </div>
            </div>
            <div class="col-lg-12">
                <!-- Tab panes -->
                <div class="tab-content">
                    <!-- popular-product start -->
                    <div id="popular-product" class="tab-pane active show">
                        <div class="row">
                            <!-- product-item start -->
                            <div class="col-lg-3 col-md-4">
                                <div th:replace="~{web/product/product-item::product-item}"></div>
                            </div>
                            <!-- product-item end -->>
                        </div>
                    </div>
                    <!-- popular-product end -->
                    <!-- new-arrival start -->
                    <div id="new-arrival" class="tab-pane" role="tabpanel">
                        <div class="row">
                            <!-- product-item start -->
                            <div class="col-lg-3 col-md-4">
                                <div th:replace="~{web/product/product-item::product-item}"></div>
                            </div>
                            <!-- product-item end -->
                        </div>
                    </div>
                    <!-- new-arrival end -->
                    <!-- best-seller start -->
                    <div id="best-seller" class="tab-pane" role="tabpanel">
                        <div class="row">
                            <!-- product-item start -->
                            <div class="col-lg-3 col-md-4">
                                <div th:replace="~{web/product/product-item::product-item}"></div>
                            </div>
                            <!-- product-item end -->
                        </div>
                    </div>
                    <!-- best-seller end -->
                    <!-- special-offer start -->
                    <div id="special-offer" class="tab-pane" role="tabpanel">
                        <div class="row">
                            <!-- product-item start -->
                            <div class="col-lg-3 col-md-4">
                                <div th:replace="~{web/product/product-item::product-item}"></div>
                            </div>
                            <!-- product-item end -->
                        </div>
                    </div>
                    <!-- special-offer end -->
                </div>
            </div>
        </div>
    </div>
</div>
