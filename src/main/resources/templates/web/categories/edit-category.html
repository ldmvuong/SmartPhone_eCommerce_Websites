<!doctype html>
<html xmlns:th="https://www.thymeleaf.org" xmlns="http://www.w3.org/1999/html">

<!-- Mirrored from htmldemo.net/subas/subas/404.html by HTTrack Website Copier/3.x [XR&CO'2014], Tue, 15 Oct 2024 02:16:37 GMT -->
<head th:replace="~{web/fragments/head::head}"></head>

<body>

<!-- Body main wrapper start -->
<div class="wrapper">

    <!-- START HEADER AREA -->
    <div th:replace="~{web/fragments/header::header}"></div>
    <!-- END HEADER AREA -->

    <!-- Start page content -->
    <div id="page-content" class="page-wrapper section">

        <!-- SHOP SECTION START -->
        <div class="shop-section mb-80">
            <div class="container">
                <div class="row">
                    <div class="col-lg-9 order-lg-1 order-1">
                        <div class="shop-content">
                            <div class="login-account p-30 box-shadow" th:fragment="edit-category">
                                <form th:action="@{/admin/edit}" method="post" th:object="${category}">
                                    <input type="text" id="categoryid" name="categoryid" th:field="${category.categoryId}" hidden="hidden">
                                    <label class="mb-3">Category Name</label>
                                    <input type="text" name="categoryname" th:field="${category.categoryName}" placeholder="Category name">
                                    <label class="mb-3">Description</label>
                                    <input type="text" name="description" placeholder="Description" th:field="${category.description}">
                                    <button class="submit-btn-1 btn-hover-1" type="submit">Edit category</button>
                                </form>
                            </div>
                        </div>
                    </div>
                    <!--                        START SIDEBAR-->
                    <div th:replace="~{web/blog/sidebar::sidebar}"></div>
                    <!--                        END SIDEBAR-->
                </div>
            </div>
        </div>
        <!-- SHOP SECTION END -->

    </div>
    <!-- End page content -->

    <!-- START FOOTER AREA -->
    <div th:replace="~{web/fragments/footer::footer}"></div>
    <!-- END FOOTER AREA -->

    <!-- START QUICKVIEW PRODUCT -->
    <div th:replace="~{web/product/quickviewProduct::quickview}"></div>
    <!-- END QUICKVIEW PRODUCT -->

</div>
<!-- Body main wrapper end -->


<!-- Placed JS at the end of the document so the pages load faster -->

<!-- jquery latest version -->
<div th:replace="~{web/fragments/script::script}"></div>


</body>


<!-- Mirrored from htmldemo.net/subas/subas/shop-list.html by HTTrack Website Copier/3.x [XR&CO'2014], Tue, 15 Oct 2024 02:16:37 GMT -->
</html>
